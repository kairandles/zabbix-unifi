          expression: find(/Ubiquiti UniFi API Host/unifi.api.host.site.ipsMode[{#SITEID}],#1,"regexp","^(ids|ips)$")<>1
          name: 'IPS/IDS is disabled or not configured (current: {ITEM.LASTVALUE})'
