      - uuid: e92fa98b8db342c594b380dd8105e1a1
        host: '{#DEVICEID}'
        name: '{#DEVICENAME} ({#MODEL})'
        group_links:
        - group:
            name: Unifi Site Hosts
        - group:
            name: Type:UnifiNetworkDevice
        - group:
            name: Type:UAP
        group_prototypes:
        - name: 'Site:{#SITENAME}'
        templates:
        - name: Ubiquiti UniFi Device
        - name: Ubiquiti UniFi UAP
        macros:
        - macro: '{$DEVICEID}'
          value: '{#DEVICEID}'
          description: Device cloud UUID
        - macro: '{$DEVICEMAC}'
          value: '{#DEVICEMAC}'
          description: Device MAC address
        - macro: '{$DEVICENAME}'
          value: '{#DEVICENAME}'
          description: Device name
        - macro: '{$MODEL}'
          value: '{#MODEL}'
          description: Device model shortname
        - macro: '{$PRODUCTLINE}'
          value: '{#PRODUCTLINE}'
          description: Device product line
        - macro: '{$HOSTID}'
          value: '{#PARENTHOSTID}'
          description: Parent gateway host ID
        - macro: '{$UNIFI.LOCAL.PORT}'
          value: '{#LOCALPORT}'
          description: Local controller HTTPS port, inherited from the root host's default at discovery time
        - macro: '{$UNIFI.LOCAL.IP}'
          value: '{#LOCALIP}'
          description: Local controller IP
        - macro: '{$UNIFI.USERNAME}'
          value: '{#USERNAME}'
          description: Local controller username (inherited from gateway)
        - macro: '{$UNIFI.PASSWORD}'
          value: '{#PASSWORD}'
          description: Local controller password (inherited from gateway)
        - macro: '{$UNIFI.SESSION.TOKEN}'
          value: '{#SESSIONTOKEN}'
          description: Cached local controller session token (inherited from gateway)
          type: SECRET_TEXT
        - macro: '{$UNIFI.LOCAL.POLL.INTERVAL}'
          value: '{#POLLINTERVAL}'
          description: Local poll interval (inherited from gateway)
        custom_interfaces: 'YES'
        interfaces:
        - ip: '{#DEVICEIP}'
      master_item:
        key: unifi.discover.devices.src
      lld_macro_paths:
      - lld_macro: '{#DEVICEID}'
        path: $.id
      - lld_macro: '{#DEVICEMAC}'
        path: $.mac
      - lld_macro: '{#DEVICENAME}'
        path: $.name
      - lld_macro: '{#MODEL}'
        path: $.model
      - lld_macro: '{#PRODUCTLINE}'
        path: $.productLine
      - lld_macro: '{#PARENTHOSTID}'
        path: $.parentHostId
      - lld_macro: '{#SHORTNAME}'
        path: $.shortname
      - lld_macro: '{#LOCALIP}'
        path: $.localIp
      - lld_macro: '{#LOCALPORT}'
        path: $.localPort
      - lld_macro: '{#DEVICEIP}'
        path: $.deviceIp
      - lld_macro: '{#USERNAME}'
        path: $.username
      - lld_macro: '{#PASSWORD}'
        path: $.password
      - lld_macro: '{#SITENAME}'
        path: $.siteName
      - lld_macro: '{#SESSIONTOKEN}'
        path: $.sessionToken
      - lld_macro: '{#POLLINTERVAL}'
        path: $.pollInterval
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var hostId = '{$HOSTID}';
          var localIp = '{$UNIFI.LOCAL.IP}';
          var localPort = '{$UNIFI.LOCAL.PORT}';
          var username = '{$UNIFI.USERNAME}';
          var password = '{$UNIFI.PASSWORD}';
          var token = d.token;
          var pollInterval = '{$UNIFI.LOCAL.POLL.INTERVAL}';
          var rec = null;
          for (var i = 0; i < d.data.length; i++) {
              if (d.data[i].hostId === hostId) { rec = d.data[i]; break; }
          }
          var all = rec ? (rec.devices || []) : [];
          var devices = all.filter(function(dev) { return !dev.isConsole; });
          for (var j = 0; j < devices.length; j++) {
              devices[j].parentHostId = hostId;
              devices[j].localIp = localIp;
              devices[j].localPort = localPort;
              devices[j].username = username;
              devices[j].password = password;
              devices[j].sessionToken = token;
              devices[j].pollInterval = pollInterval;
              devices[j].deviceIp = devices[j].ip || '';
              devices[j].shortname = devices[j].shortname || devices[j].model || '';
              devices[j].siteName = '{$SITENAME}';
          }
          return JSON.stringify(devices);
