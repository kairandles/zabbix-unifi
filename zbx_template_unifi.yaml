    - uuid: 0fcae29783114877a760de040a75698e
      name: Discover Host Controllers
      type: DEPENDENT
      key: unifi.discover.hostcontrollers
      delay: '0'
      filter:
        conditions:
        - macro: '{#INSTALLSTATE}'
          value: uninstalled
          operator: NOT_MATCHES_REGEX
          formulaid: A
      item_prototypes:
      - uuid: 28b446e2b2414a59a586cc1ac52cd421
        name: '{#HOSTNAME} Controllers: {#CONTROLLERNAME} isRunning'
        type: DEPENDENT
        key: unifi.api.host.controller.isRunning[{#CONTROLLERNAME}]
        delay: '0'
        history: 90d
        value_type: TEXT
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $..reportedState.controllers[?(@.name=="{#CONTROLLERNAME}")].isRunning.first()
        master_item:
          key: unifi.api.hosts
        tags:
        - tag: controller
          value: '{#CONTROLLERNAME}'
        - tag: type
          value: Unifi Controller
        trigger_prototypes:
        - uuid: 9dba9091d7ca4551bf803fa76d54fdc2
          expression: find(/Ubiquiti UniFi API 
            Host/unifi.api.host.controller.isRunning[{#CONTROLLERNAME}],#1,"regexp","false")=1
          name: Controller {#CONTROLLERNAME} is not running on {HOST.NAME}
          priority: HIGH
          description: The {#CONTROLLERNAME} application has stopped on this console. Managed devices under this 
            controller will continue operating with their last config, but cannot be reconfigured until the controller 
            restarts. Check the console health in UniFi OS.
      - uuid: 8277809ecd2246ddaa1f29f11453a81e
        name: '{#HOSTNAME} Controllers: {#CONTROLLERNAME} unadoptedDevices'
        type: DEPENDENT
        key: unifi.api.host.controller.unadoptedDevices[{#CONTROLLERNAME}]
        delay: '0'
        history: 90d
        value_type: TEXT
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $..reportedState.controllers[?(@.name=="{#CONTROLLERNAME}")].unadoptedDevices.first()
        - type: REGEX
          parameters:
          - ^\[(.*)\]$
          - \1
        - type: JSONPATH
          parameters:
          - $.totalCount
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        master_item:
          key: unifi.api.hosts
        tags:
        - tag: controller
          value: '{#CONTROLLERNAME}'
        - tag: type
          value: Unifi Controller
        trigger_prototypes:
        - uuid: 88664528aaaf4ac7834bbc54c2507623
          expression: last(/Ubiquiti UniFi API Host/unifi.api.host.controller.unadoptedDevices[{#CONTROLLERNAME}])=1
          name: '{ITEM.LASTVALUE} unadopted device found for {#CONTROLLERNAME} on {HOST.NAME}'
          priority: WARNING
          description: A device has connected to this site but has not been adopted into the {#CONTROLLERNAME} 
            controller. It will not be managed or appear in the dashboard until adopted. Check Devices in the UniFi 
            dashboard.
        - uuid: dffaffb9682d44fe9344375a5ae87d6b
          expression: last(/Ubiquiti UniFi API Host/unifi.api.host.controller.unadoptedDevices[{#CONTROLLERNAME}])>1
          name: '{ITEM.LASTVALUE} unadopted devices found for {#CONTROLLERNAME} on {HOST.NAME}'
          priority: WARNING
          description: Multiple devices are unadopted in the {#CONTROLLERNAME} controller. They will not receive config 
            or firmware updates. Check Devices in the UniFi dashboard and adopt or reject each as appropriate.
      - uuid: 0429e2473c1e40c5ab73b81e4d44c0b8
        name: '{#HOSTNAME} Controllers: {#CONTROLLERNAME} updateAvailable'
        type: DEPENDENT
        key: unifi.api.host.controller.updateAvailable[{#CONTROLLERNAME}]
        delay: '0'
        history: 90d
        value_type: TEXT
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $..reportedState.controllers[?(@.name=="{#CONTROLLERNAME}")].updateAvailable.first()
        master_item:
          key: unifi.api.hosts
        tags:
        - tag: controller
          value: '{#CONTROLLERNAME}'
        - tag: type
          value: Unifi Controller
        trigger_prototypes:
        - uuid: 30db991557ee45a78e918bc1569d0bfc
          expression: find(/Ubiquiti UniFi API 
            Host/unifi.api.host.controller.updateAvailable[{#CONTROLLERNAME}],#1,"regexp","(null)")<>1
          name: 'Update available for {#CONTROLLERNAME}: {ITEM.LASTVALUE}'
          priority: INFO
          description: A new software version is available for the {#CONTROLLERNAME} controller application. Updates can
            be applied from UniFi OS under Apps. Schedule during a maintenance window - the controller will briefly 
            restart.
      - uuid: 603b279e3119445a999d025e46a388c5
        name: '{#HOSTNAME} Controllers: {#CONTROLLERNAME} version'
        type: DEPENDENT
        key: unifi.api.host.controller.version[{#CONTROLLERNAME}]
        delay: '0'
        history: 90d
        value_type: TEXT
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $..reportedState.controllers[?(@.name=="{#CONTROLLERNAME}")].version.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: unifi.api.hosts
        tags:
        - tag: controller
          value: '{#CONTROLLERNAME}'
        - tag: type
          value: Unifi Controller
        trigger_prototypes:
        - uuid: 41c3d7ff77654e6cb3172e1aa9f7442e
          expression: change(/Ubiquiti UniFi API Host/unifi.api.host.controller.version[{#CONTROLLERNAME}])=1
          name: '{#CONTROLLERNAME} version changed on {HOST.NAME}'
          priority: INFO
          description: The {#CONTROLLERNAME} application version has changed, indicating an update was applied. Monitor 
            for stability over the next hour and verify managed devices are still responding.
          manual_close: 'YES'
      master_item:
        key: unifi.api.hosts
      lld_macro_paths:
      - lld_macro: '{#CONTROLLERNAME}'
        path: $..name.first()
      - lld_macro: '{#HOSTNAME}'
        path: $..unifi_hostname.first()
      - lld_macro: '{#INSTALLED}'
        path: $..isInstalled.first()
      - lld_macro: '{#INSTALLSTATE}'
        path: $..installState.first()
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var obj=JSON.parse(value);

          //Get the Hostname
          var unifi_hostname=obj.data.reportedState.hostname;
          //Insert hostname to each controller for preprosessing LLD
          obj.data.reportedState.controllers.forEach(function(controller) {
              controller.unifi_hostname = unifi_hostname;
          });

          return JSON.stringify(obj.data.reportedState.controllers);
    - uuid: b50ef3bb6bdb4f839bc771b16c2ed8e1
