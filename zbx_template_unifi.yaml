zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 7df96b18c230490a9a0a9e2307226338
    name: Templates
  host_groups:
  - uuid: cf0ece1934724fc29985a527d5c75864
    name: Unifi Site Hosts
  - uuid: 39316001823e4d8e96cc0d88c01e0a86
    name: Type:UnifiNetworkDevice
  - uuid: 61584d74f8b94ad8aad229bd8d1a8246
    name: Type:UAP
  - uuid: b89e72a38edc432bb5fe96ba0b9d2fe4
    name: Type:USW
  - uuid: 27d4d839006c40e48a3958444730a873
    name: Type:UPS
  - uuid: 63ff62e029104e9da68778a39c2ad59c
    name: Type:RPS
  - uuid: 4347aa146b164d5e933dbfa8bc987b0e
    name: Type:UnifiProtectDevice
  - uuid: 35b0b68e3314424199452478df0a30d2
    name: Type:UnifiProtectCamera
  templates:
  - uuid: 062e9b53e601427db62d21558c9b5d99
    template: Ubiquiti UniFi API
    name: Ubiquiti UniFi API
    description: |
      Zabbix UniFi API monitoring template for UniFi Site Manager API v1 (https://developer.ui.com/site-manager/v1.0.0/gettingstarted)

      Template available at https://github.com/kairandles/zabbix-unifi

      Version: 1.6.0
    groups:
    - name: Templates
    items:
    - uuid: bcd77fc83418401984ba49a218a4a464
      name: 'Unifi API Raw: Hosts'
      type: HTTP_AGENT
      key: unifi.api.hosts
      delay: 1m
      history: 1h
      value_type: TEXT
      trends: '0'
      url: https://api.ui.com/v1/hosts
      timeout: 15s
      headers:
      - name: Accept
        value: application/json
      - name: x-api-key
        value: '{$APIKEY}'
      tags:
      - tag: component
        value: raw
    - uuid: c4d2c6f96b2a4a859c07bf58f96b8287
      name: 'Unifi SD-WAN Raw: Configs List'
      type: HTTP_AGENT
      key: unifi.sdwan.configs
      delay: 1m
      history: 1h
      value_type: TEXT
      trends: '0'
      url: https://api.ui.com/v1/sd-wan-configs
      timeout: 15s
      headers:
      - name: Accept
        value: application/json
      - name: x-api-key
        value: '{$APIKEY}'
      tags:
      - tag: component
        value: raw
    discovery_rules:
    - uuid: e29c11c782014aa6a22fd7991f6d4ef4
      name: Discover Unifi Hosts
      type: DEPENDENT
      key: unifi.api.discover.hosts
      delay: '0'
      host_prototypes:
      - uuid: 1cbf4d69cdbb43959561a1fb0ef20993
        host: '{#HARDWAREID}'
        name: '{#NAME}'
        inventory_mode: AUTOMATIC
        group_links:
        - group:
            name: Unifi Site Hosts
        - group:
            name: Type:UnifiNetworkDevice
        group_prototypes:
        - name: 'Site:{#SITENAME}'
        templates:
        - name: Ubiquiti UniFi API Host
        macros:
        - macro: '{$HOSTID}'
          value: '{#HOSTID}'
          description: Unifi API Host ID
        - macro: '{$SITENAME}'
          value: '{#SITENAME}'
          description: Site name derived from hostname - used for host group assignment
        - macro: '{$UNIFI.LOCAL.PORT}'
          value: '{#LOCALPORT}'
          description: Local controller HTTPS port, inherited from the root host's default at discovery time
        - macro: '{$UNIFI.LOCAL.IP}'
          value: '{#LOCALIP}'
          description: Local management IP of this console (e.g. 10.183.200.1)
        - macro: '{$APIKEY}'
          value: '{#APIKEY}'
          description: UniFi Site Manager API key, inherited from the root host's default at discovery time
          type: SECRET_TEXT
        - macro: '{$UNIFI.USERNAME}'
          value: '{#USERNAME}'
          description: Local controller username, inherited from the root host's default at discovery time
        - macro: '{$UNIFI.PASSWORD}'
          value: '{#PASSWORD}'
          description: Local controller password, inherited from the root host's default at discovery time
          type: SECRET_TEXT
        - macro: '{$UNIFI.LOCAL.POLL.INTERVAL}'
          value: '{#POLLINTERVAL}'
          description: Local poll interval, inherited from the root host's default at discovery time
        - macro: '{$UNIFI.CONSOLE.POLL.INTERVAL}'
          value: '{#CONSOLEPOLLINTERVAL}'
          description: Console combined local poll interval, inherited from the root host's default at discovery time
        - macro: '{$UNIFI.SESSION.REFRESH.INTERVAL}'
          value: '{#SESSIONREFRESHINTERVAL}'
          description: Console session-token refresh interval, inherited from the root host's default at discovery time
        - macro: '{$UNIFI.LOCAL.API.ENABLED}'
          value: '{#LOCALAPIENABLED}'
          description: Local API enable flag (1/0), inherited from the root host's default at discovery time
        custom_interfaces: 'YES'
        interfaces:
        - ip: '{#LOCALIP}'
      master_item:
        key: unifi.api.hosts
      lld_macro_paths:
      - lld_macro: '{#HARDWAREID}'
        path: $..hardwareId.first()
      - lld_macro: '{#HOSTID}'
        path: $..id.first()
      - lld_macro: '{#NAME}'
        path: $..reportedState.hostname.first()
      - lld_macro: '{#LOCALIP}'
        path: $.localIp
      - lld_macro: '{#LOCALPORT}'
        path: $.localPort
      - lld_macro: '{#APIKEY}'
        path: $.apikey
      - lld_macro: '{#SITENAME}'
        path: $.siteName
      - lld_macro: '{#USERNAME}'
        path: $.username
      - lld_macro: '{#PASSWORD}'
        path: $.password
      - lld_macro: '{#POLLINTERVAL}'
        path: $.pollInterval
      - lld_macro: '{#CONSOLEPOLLINTERVAL}'
        path: $.consolePollInterval
      - lld_macro: '{#SESSIONREFRESHINTERVAL}'
        path: $.sessionRefreshInterval
      - lld_macro: '{#LOCALAPIENABLED}'
        path: $.localApiEnabled
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[*]
      - type: JAVASCRIPT
        parameters:
        - |
          var obj = JSON.parse(value);
          // Workaround: the UniFi API does not enforce an API key's configured
          // site restrictions on /v1/hosts or /v1/sites - they always return every
          // console on the account. This macro lets you exclude sites client-side.
          var excludeRaw = '{$UNIFI.SITE.EXCLUDE}';
          var excluded = [];
          if (excludeRaw && excludeRaw.trim().length > 0) {
              var parts = excludeRaw.split(',');
              for (var e = 0; e < parts.length; e++) {
                  var t = parts[e].trim();
                  if (t.length > 0) { excluded.push(t); }
              }
          }
          function isPrivate(ip) {
              if (ip.indexOf('10.') === 0 || ip.indexOf('192.168.') === 0) { return true; }
              if (ip.indexOf('172.') === 0) {
                  var oct = parseInt(ip.split('.')[1], 10);
                  return oct >= 16 && oct <= 31;
              }
              return false;
          }
          var result = [];
          for (var i = 0, n = Object.keys(obj).length; i < n; i++) {
              var rs = obj[i].reportedState || {};
              var hostname = (rs.hostname || '');
              var hostId = (obj[i].id || '');
              var hostIdPrefix = hostId.split(':')[0];
              if (excluded.indexOf(hostname) !== -1 ||
                  excluded.indexOf(hostId) !== -1 ||
                  excluded.indexOf(hostIdPrefix) !== -1) {
                  continue;
              }
              // Local IP selection. ipAddrs is only populated by the Network app, so
              // consoles without it (UNAS, CloudKey running Protect only) report an
              // empty list and expose their address in reportedState.ip instead -
              // treated here as one more candidate. On double-NAT gateways a WAN
              // address can itself be RFC1918, so addresses matching a WAN interface
              // IP are only used as a last resort.
              var candidates = (rs.ipAddrs || []).slice();
              if (rs.ip && candidates.indexOf(rs.ip) === -1) { candidates.push(rs.ip); }
              var wans = rs.wans || [];
              var wanIps = [];
              for (var w = 0; w < wans.length; w++) {
                  if (wans[w].ipv4) { wanIps.push(wans[w].ipv4); }
              }
              var localIp = '';
              for (var a = 0; a < candidates.length && !localIp; a++) {
                  if (isPrivate(candidates[a]) && wanIps.indexOf(candidates[a]) === -1) { localIp = candidates[a]; }
              }
              for (var b = 0; b < candidates.length && !localIp; b++) {
                  if (isPrivate(candidates[b])) { localIp = candidates[b]; }
              }
              obj[i].localIp = localIp;
              // Derive site name from hostname: "Randles-Family-SC-186" -> "Randles-Family"
              var siteName = hostname.replace(/-SC-[0-9]+$/, '').replace(/-CGU$/, '');
              obj[i].siteName = siteName || hostname;
              // Propagate the root host's default local credentials to each discovered console
              obj[i].apikey = '{$APIKEY}';
              obj[i].username = '{$UNIFI.USERNAME}';
              obj[i].password = '{$UNIFI.PASSWORD}';
              obj[i].pollInterval = '{$UNIFI.LOCAL.POLL.INTERVAL}';
              obj[i].consolePollInterval = '{$UNIFI.CONSOLE.POLL.INTERVAL}';
              obj[i].sessionRefreshInterval = '{$UNIFI.SESSION.REFRESH.INTERVAL}';
              obj[i].localApiEnabled = '{$UNIFI.LOCAL.API.ENABLED}';
              obj[i].localPort = '{$UNIFI.LOCAL.PORT}';
              delete obj[i].reportedState.controllers;
              delete obj[i].features;
              delete obj[i].userData;
              result.push(obj[i]);
          }
          return JSON.stringify(result);
    - uuid: d7997156360b41d7af58cde5af9b4be0
      name: Discover SD-WAN Configs
      type: DEPENDENT
      key: unifi.sdwan.discover.configs
      delay: '0'
      host_prototypes:
      - uuid: 0a5668f871664708bfbcbbaaeaf48ea1
        host: '{#SDWANID}'
        name: '{#SDWANNAME}'
        group_links:
        - group:
            name: Unifi Site Hosts
        - group:
            name: Type:UnifiNetworkDevice
        templates:
        - name: Ubiquiti UniFi SD-WAN
        macros:
        - macro: '{$SDWANID}'
          value: '{#SDWANID}'
          description: SD-WAN Config ID
      master_item:
        key: unifi.sdwan.configs
      lld_macro_paths:
      - lld_macro: '{#SDWANID}'
        path: $.id
      - lld_macro: '{#SDWANNAME}'
        path: $.name
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[*]
    macros:
    - macro: '{$APIKEY}'
      type: SECRET_TEXT
      description: API Key to access api.ui.com
    - macro: '{$UNIFI.USERNAME}'
      description: Default local controller read-only username, propagated to every discovered console unless overridden
        on that console's own host. Set this here (not on the template) so it survives re-importing the template.
    - macro: '{$UNIFI.PASSWORD}'
      type: SECRET_TEXT
      description: Default local controller password, propagated to every discovered console unless overridden on that
        console's own host. Set this here (not on the template) so it survives re-importing the template.
    - macro: '{$UNIFI.LOCAL.POLL.INTERVAL}'
      value: 10s
      description: Default per-device local poll interval, propagated to every discovered console and then on to every
        device, unless overridden at the console or device level. Not a secret, so (unlike username/password) the real
        default lives here on the template rather than requiring a root host override.
    - macro: '{$UNIFI.CONSOLE.POLL.INTERVAL}'
      value: 3m
      description: Default interval for the console's own combined local poll ("Local Raw (Combined)"), propagated to
        every discovered console unless overridden on that console's own host.
    - macro: '{$UNIFI.SESSION.REFRESH.INTERVAL}'
      value: 10m
      description: 'Default interval for the console''s session-token mint + cloud device fetch ("Local Session + Cloud
        Devices Raw"), propagated to every discovered console unless overridden on that console''s own host. Deliberately far below the
        ~2 hour session token lifetime (a 12x margin) - the login this item performs is O(1) per console regardless of
        device count, so more frequent refreshes are cheap, but the exact conditions that trip UniFi''s local rate limiter
        aren''t fully known (confirmed concurrent-login-based; a rolling per-time-window limit hasn''t been ruled out), so
        this stays conservative rather than refreshing every minute just because the login itself is cheap. Network device
        discovery (UAP/USW/UPS/RPS/Other) no longer depends on this item - it is driven by "Unifi API Raw: Host Devices"
        (cloud-only, 1m) so it keeps working even with no local network access to the console. Protect camera/other device
        discovery is local-API-only (Site Manager v1 has no Protect inventory endpoint) and still seeds its session token
        from this item''s cache, though its own poll cadence is {$UNIFI.CONSOLE.POLL.INTERVAL}.'
    - macro: '{$UNIFI.LOCAL.API.ENABLED}'
      value: '1'
      description: Default local-API enable flag, propagated to every discovered console unless overridden on that console's
        own host. Set to 0 to skip local polling by default for all consoles (see the macro of the same name on Ubiquiti
        UniFi API Host for exactly which items it can and cannot gate); leave at 1 and override per console for mixed fleets.
    - macro: '{$WAN_UPTIME_WARN}'
      value: '99'
      description: 'WAN uptime % below which AVERAGE alert fires (default: 99%)'
    - macro: '{$WAN_UPTIME_HIGH}'
      value: '95'
      description: 'WAN uptime % below which DISASTER alert fires (default: 95%)'
    - macro: '{$UNIFI.WAN.LATENCY.WARN}'
      value: '150'
      description: 'Latency threshold in ms for WARNING alert. Raise to 200+ for Central America sites where 60-80ms to UK
        is normal (default: 150)'
    - macro: '{$UNIFI.LOCAL.PORT}'
      value: '443'
      description: 'Local controller HTTPS port, copied to every discovered console and device at discovery time.
        443 on UniFi OS consoles (UDM, CloudKey, UX); set this to 11443 for self-hosted UniFi OS Server. Override
        per console on that console''s own host if a fleet is mixed.'
    - macro: '{$UNIFI.SITE.EXCLUDE}'
      value: ''
      description: 'Comma-separated list of consoles to exclude from discovery. Workaround for the UniFi API not enforcing
        an API key''s configured site restrictions on /v1/hosts and /v1/sites - those endpoints always return every console
        on the account regardless of key scope. Accepts any of: the console hostname (e.g. "MyConsole"), the
        full host ID as it appears in the unifi.ui.com console URL (e.g. "AABBCCDDEEFF00000000000000000000000000000000000000000000112233:1234567890"),
        or just the ID portion before the colon (e.g. "AABBCCDDEEFF00000000000000000000000000000000000000000000112233").'
  - uuid: d8cf0c6a2d19418b8e7c2adcb9c2b4c1
    template: Ubiquiti UniFi API Host
    name: Ubiquiti UniFi API Host
    description: |
      Zabbix UniFi API monitoring template for UniFi Site Manager API v1 (https://developer.ui.com/site-manager/v1.0.0/gettingstarted). Used by hosts discovered in Ubiquiti UniFi API.

      Template available at https://github.com/kairandles/zabbix-unifi

      Version: 1.6.0
    groups:
    - name: Templates
    items:
    - uuid: 4c54e7d755c04af587cfef3bf00f4585
      name: Location Latitude
      type: DEPENDENT
      key: unifi.api.host.location.lat
      delay: '0'
      history: 90d
      value_type: FLOAT
      trends: '0'
      inventory_link: LOCATION_LAT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.location.lat.first()
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
    - uuid: bdaa59c4eac44be886264f9c5994d34e
      name: Location Longitude
      type: DEPENDENT
      key: unifi.api.host.location.lon
      delay: '0'
      history: 90d
      value_type: FLOAT
      trends: '0'
      inventory_link: LOCATION_LON
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.location.long.first()
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
    - uuid: 4eb9666aa10347c1828bb7dc6ca9b56c
      name: Location Name
      type: DEPENDENT
      key: unifi.api.host.location.text
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      inventory_link: LOCATION
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.location.text.first()
        error_handler: CUSTOM_VALUE
        error_handler_params: ''
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
    - uuid: 12960416c3234602a531ccb4d3b5b27a
      name: Hardware Type
      type: DEPENDENT
      key: unifi.api.host.hwtype
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      inventory_link: HARDWARE
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.hardware.name.first()
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
    - uuid: 065c4435662d4300a7ebcc9a999ebb6b
      name: Blocked State
      type: DEPENDENT
      key: unifi.api.host.isBlocked
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..isBlocked.first()
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
      triggers:
      - uuid: 4e5e4741501646d8b806052bad5d19cf
        expression: find(/Ubiquiti UniFi API Host/unifi.api.host.isBlocked,#1,"regexp","true")=1
        name: Host is blocked by Ubiquiti
        priority: HIGH
        description: This UniFi console has been blocked in the Ubiquiti account, likely due to a billing, ToS, or 
          ownership issue. The device will not receive cloud management commands until unblocked. Log in to 
          account.ui.com to resolve.
        manual_close: 'YES'
    - uuid: 425f09b3fa0e418589feb315c0c19a53
      name: Latest Backup time
      type: DEPENDENT
      key: unifi.api.host.latestBackupTime
      delay: '0'
      history: 90d
      trends: '0'
      units: unixtime
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..latestBackupTime.first()
      - type: JAVASCRIPT
        parameters:
        - |
          var date = new Date(value);
          return Math.floor(date.getTime() / 1000);
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
      triggers:
      - uuid: 5d9ac579a04d48fdac3eef43c738d3be
        expression: fuzzytime(/Ubiquiti UniFi API Host/unifi.api.host.latestBackupTime,{$BACKUP_INTERVAL})=0
        name: No backup within expected interval ({$BACKUP_INTERVAL})
        priority: AVERAGE
        description: The last recorded backup is older than the {$BACKUP_INTERVAL} threshold. Set this to 1 day beyond 
          your configured backup schedule (Settings > System > Backups). Daily=2d, Weekly=8d, Monthly=32d. Manual close 
          once confirmed or backup manually triggered.
        manual_close: 'YES'
    - uuid: e4044d85dde243ddae2066de22a02764
      name: Public IP Address
      type: DEPENDENT
      key: unifi.api.host.publicip
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.ipAddress
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
    - uuid: 5c86249852e3457d9a6484a46ec8d589
      name: Hardware Serial Number
      type: DEPENDENT
      key: unifi.api.host.serial
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      inventory_link: SERIALNO_A
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.hardware.serialno.first()
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
    - uuid: f7eb1f5a815d437c8e02217a58cafab2
      name: Unifi Stack status
      type: DEPENDENT
      key: unifi.api.host.stack
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.isStacked.first()
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
    - uuid: ccf31a17c95f4dba8b9a0bdd0d0bf6af
      name: Unadopted UnifiOS devices
      type: DEPENDENT
      key: unifi.api.host.unadoptedUnifiOSDevices
      delay: '0'
      units: devices
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.unadoptedUnifiOSDevices.first()
      - type: REGEX
        parameters:
        - ^\[(.*)\]$
        - \1
      - type: JSONPATH
        parameters:
        - $.totalCount
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
      triggers:
      - uuid: 42366384773f40c18b3856fb5213bbe1
        expression: last(/Ubiquiti UniFi API Host/unifi.api.host.unadoptedUnifiOSDevices)>0
        name: '{ITEM.LASTVALUE} unadopted UnifiOS device(s) found on this console'
        priority: WARNING
        description: UnifiOS devices attached to this console are in an unadopted state. They will not be managed or 
          monitored until adopted. Check the UniFi dashboard under Devices for devices showing as "Pending Adoption".
    - uuid: 85013a2d5b314fe59dcf140befd89d24
      name: UniFiOS Version
      type: DEPENDENT
      key: unifi.api.host.version
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      inventory_link: SOFTWARE
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.version.first()
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
      triggers:
      - uuid: afc59094460549a9840d683f8173cc57
        expression: change(/Ubiquiti UniFi API Host/unifi.api.host.version)=1
        name: UniFiOS version changed to {ITEM.LASTVALUE}
        priority: INFO
        description: The UniFiOS firmware version on this console has changed. This is expected after a scheduled 
          update. Verify stability in the hours following an update and confirm all controllers are still running.
        manual_close: 'YES'
    - uuid: 75db7d05e7da4a06920b3a348e9be5da
      name: Firmware Update Available
      type: DEPENDENT
      key: unifi.api.host.firmwareUpdate
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.firmwareUpdate.latestAvailableVersion.first()
        error_handler: CUSTOM_VALUE
        error_handler_params: none
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
      triggers:
      - uuid: 3f397f58244e47f4ae5aa8762932f7bc
        expression: find(/Ubiquiti UniFi API Host/unifi.api.host.firmwareUpdate,#1,"regexp","^(none|null)$")<>1
        name: 'UniFiOS firmware update available: {ITEM.LASTVALUE}'
