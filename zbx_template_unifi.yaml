        tags:
        - tag: component
          value: Unifi WAN
        - tag: wan
          value: '{#WANTYPE}'
      master_item:
        key: unifi.api.hosts
      lld_macro_paths:
      - lld_macro: '{#WANTYPE}'
        path: $..type.first()
      - lld_macro: '{#WANINTERFACE}'
        path: $..interface.first()
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var obj = JSON.parse(value);
          var wans = obj.data.reportedState.wans || [];
          return JSON.stringify(wans);
