      master_item:
        key: unifi.ups.device
      tags:
      - tag: component
        value: ups
      triggers:
      - uuid: 7434f16fbfe644ff83c8dd7740f028da
        expression: last(/Ubiquiti UniFi UPS/unifi.ups.battery.level)<{$UNIFI.UPS.BATTERY.HIGH}
        name: '{HOST.NAME} battery critical: {ITEM.LASTVALUE} (threshold: {$UNIFI.UPS.BATTERY.HIGH}%)'
