        value: device
    - uuid: dc27ab45d5ec4f8ebc8586593c59187a
      name: Startup Time
      type: DEPENDENT
      key: unifi.api.device.startupTime
      delay: '0'
      history: 90d
      trends: '0'
      units: unixtime
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var id = '{$DEVICEID}';
          var hostId = '{$HOSTID}';
          for (var i = 0; i < d.data.length; i++) {
              if (d.data[i].hostId !== hostId) continue;
              var devs = d.data[i].devices || [];
              for (var j = 0; j < devs.length; j++) {
                  if (devs[j].id === id) {
                      var t = devs[j].startupTime;
                      if (!t) return 0;
                      return Math.floor(new Date(t).getTime() / 1000);
                  }
              }
          }
          return 0;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: unifi.api.device.raw
      tags:
      - tag: component
        value: device
      triggers:
      - uuid: 410950363a674b16a8a9644843268743
        expression: change(/Ubiquiti UniFi Device/unifi.api.device.startupTime)=1 and last(/Ubiquiti UniFi
          Device/unifi.api.device.startupTime)>0 and abs(last(/Ubiquiti UniFi Device/unifi.api.device.startupTime)-last(/Ubiquiti UniFi Device/unifi.api.device.startupTime,#2))>300
        name: '{HOST.NAME} has rebooted'
        priority: INFO
        description: The startup time changed, indicating the device rebooted. If unscheduled, check for power issues or
          firmware updates.
        manual_close: 'YES'
    - uuid: 2ddebb7e54754e919535dad774226e66
      name: Managed State
      type: DEPENDENT
      key: unifi.api.device.isManaged
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var id = '{$DEVICEID}';
          var hostId = '{$HOSTID}';
          for (var i = 0; i < d.data.length; i++) {
              if (d.data[i].hostId !== hostId) continue;
              var devs = d.data[i].devices || [];
              for (var j = 0; j < devs.length; j++) {
                  if (devs[j].id === id) return String(devs[j].isManaged);
              }
          }
          return 'unknown';
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 10m
      master_item:
        key: unifi.api.device.raw
      tags:
      - tag: component
        value: device
      triggers:
      - uuid: 11148652ed2741e883be851fae66bf24
        expression: find(/Ubiquiti UniFi Device/unifi.api.device.isManaged,#1,"regexp","false")=1
        name: '{HOST.NAME} is no longer managed'
        priority: AVERAGE
        description: This device has been removed from management. It will not receive configuration or firmware updates
          and will not appear in the UniFi dashboard. Re-adopt the device or remove it if decommissioned.
    macros:
    - macro: '{$HOSTID}'
      description: Parent gateway host ID - set automatically by host prototype discovery
    - macro: '{$DEVICEID}'
