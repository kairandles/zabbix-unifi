    description: |
      Local Protect controller polling for UniFi cameras (including doorbells). Discovered by "Discover Host
      Protect Cameras" on Ubiquiti UniFi API Host. Reuses the same session token already cached by that console's
      unifi.host.session item - no separate login or credentials of its own.

      Version: 1.6.0
    groups:
    - name: Templates
    items:
    - uuid: 5636a644f68c4acca07629c967ee4778
      name: Protect Camera Device Raw
      type: HTTP_AGENT
      key: unifi.protect.camera.device
      delay: '{$UNIFI.LOCAL.POLL.INTERVAL}'
      history: 1h
      value_type: TEXT
      trends: '0'
      url: https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.PROTECT.API.URI}/bootstrap
      timeout: 10s
      headers:
      - name: Cookie
        value: '{$UNIFI.API.AUTH.TOKEN}={$UNIFI.SESSION.TOKEN}'
      verify_peer: 'NO'
      verify_host: 'NO'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          try {
              var mac = '{$DEVICEMAC}';
              var macNorm = mac.replace(/:/g,'').toLowerCase();
              var d;

              try {
                  d = JSON.parse(value);
                  if (!d || !Array.isArray(d.cameras)) throw 'unexpected response shape';
              } catch (e) {
                  Zabbix.log(4, '[UniFi Protect Camera] cached token rejected (' + e + '), requesting a fresh one');

                  var loginReq = new HttpRequest();
                  loginReq.addHeader('Content-Type: application/json');
                  loginReq.post('https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.API.AUTH.URI}',
                      JSON.stringify({username: '{$UNIFI.USERNAME}', password: '{$UNIFI.PASSWORD}'}));
                  if (loginReq.getStatus() !== 200) throw 'fresh login HTTP ' + loginReq.getStatus();

                  var headers = loginReq.getHeaders();
                  var setCookie = null;
                  for (var h in headers) { if (h.toLowerCase() === 'set-cookie') { setCookie = headers[h]; break; } }
                  var m = setCookie && setCookie.match(/{$UNIFI.API.AUTH.TOKEN}=([^;]+);/);
                  if (!m) throw 'fresh login: no token in response headers';

                  var dataReq = new HttpRequest();
                  dataReq.addHeader('Cookie: {$UNIFI.API.AUTH.TOKEN}=' + m[1]);
                  var dataResp = dataReq.get('https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.PROTECT.API.URI}/bootstrap');
                  if (dataReq.getStatus() !== 200) throw 'fresh GET HTTP ' + dataReq.getStatus();
                  d = JSON.parse(dataResp);
                  if (!d || !Array.isArray(d.cameras)) throw 'fresh GET: unexpected response shape';
              }

              var dev = d.cameras.filter(function(x) { return x.mac && x.mac.replace(/:/g,'').toLowerCase() === macNorm; });
              return JSON.stringify({data: dev});
          } catch(e) {
              Zabbix.log(4, '[UniFi Protect Camera] ' + e);
              throw e;
          }
      tags:
      - tag: component
        value: raw
    - uuid: 96d0cbdfc12b4a9bac48a30a5cb555d7
