        - tag: wan
          value: '{#WANTYPE}'
        trigger_prototypes:
        - uuid: a7804970a4164387a7c217ba89babc4b
          expression: change(/Ubiquiti UniFi API Host/unifi.api.host.wan.ipv4[{#WANTYPE}])=1
          name: '{#WANTYPE} IPv4 changed to {ITEM.LASTVALUE} on {HOST.NAME}'
          priority: WARNING
          description: The IPv4 address on {#WANTYPE} has changed. Expected on dynamic ISP connections or after a DHCP 
            renewal. SD-WAN tunnels using this interface should renegotiate automatically within minutes.
          manual_close: 'YES'
      - uuid: 4926c166f1204271bb4506cd44724a9d
        name: WAN {#WANTYPE} Speed Type
