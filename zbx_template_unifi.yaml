      name: 'Unifi API Raw: Host Devices'
      type: HTTP_AGENT
      key: unifi.api.host.devices
      delay: 1m
      history: 1h
      value_type: TEXT
      trends: '0'
      url: https://api.ui.com/v1/devices?hostId={$HOSTID}
      timeout: 15s
      headers:
      - name: Accept
        value: application/json
      - name: x-api-key
        value: '{$APIKEY}'
      tags:
      - tag: component
        value: raw
    - uuid: 06cb8934f8cc4cc28feb0d5c5209e3d8
      name: 'Device Discovery Source'
      type: CALCULATED
      key: unifi.discover.devices.src
      delay: '{$UNIFI.SESSION.REFRESH.INTERVAL}'
      history: 1h
      value_type: TEXT
      trends: '0'
      params: last(//unifi.api.host.devices)
      description: 'Master item for the five Network device discovery rules. Carries the cloud device inventory (from
        "Unifi API Raw: Host Devices", so discovery still works on a console with no local path) with a freshly minted
        local session token attached, which the host prototypes hand to each device as {$UNIFI.SESSION.TOKEN}. The
        token is best-effort: if the local login fails the device list is still returned with an empty token, so
        discovery never blocks on local access. Refreshed on {$UNIFI.SESSION.REFRESH.INTERVAL} (default 10m), well
        inside the ~2 hour token lifetime, and costs exactly one login per console per refresh.'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var cloud;
          try {
              cloud = JSON.parse(value);
          } catch (e) {
              throw 'cloud device list unavailable: ' + e;
          }

          // The token is deliberately best-effort. A console with no local path from
          // this Zabbix server must still discover its devices (they are monitored
          // cloud-side regardless), so a failed login yields an empty token rather
          // than failing the item and stalling discovery.
          var token = '';
          if ('{$UNIFI.LOCAL.API.ENABLED}' !== '0') {
              try {
                  var req = new HttpRequest();
                  req.addHeader('Content-Type: application/json');
                  req.post('https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.API.AUTH.URI}',
                      JSON.stringify({username: '{$UNIFI.USERNAME}', password: '{$UNIFI.PASSWORD}'}));
                  if (req.getStatus() === 200) {
                      var headers = req.getHeaders();
                      for (var h in headers) {
                          if (h.toLowerCase() === 'set-cookie') {
                              var m = String(headers[h]).match(/{$UNIFI.API.AUTH.TOKEN}=([^;]+);/);
                              if (m) { token = m[1]; }
                              break;
                          }
                      }
                  } else {
                      Zabbix.log(4, '[UniFi discovery] local login HTTP ' + req.getStatus() + ' - discovering devices without a local token');
                  }
              } catch (e) {
                  Zabbix.log(4, '[UniFi discovery] local login failed (' + e + ') - discovering devices without a local token');
              }
          }
          cloud.token = token;
          return JSON.stringify(cloud);
      tags:
      - tag: component
        value: raw
    - uuid: 122dd6a2e28a4f22b897feb716fe026d
      name: 'Local Session + Cloud Devices Raw'
      type: HTTP_AGENT
      key: unifi.host.session
      delay: '{$UNIFI.SESSION.REFRESH.INTERVAL}'
      history: 1h
      value_type: TEXT
      trends: '0'
      url: https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.API.AUTH.URI}
      post_type: JSON
      posts: '{"username":"{$UNIFI.USERNAME}","password":"{$UNIFI.PASSWORD}"}'
      request_method: POST
      retrieve_mode: HEADERS
      timeout: 15s
      verify_peer: 'NO'
      verify_host: 'NO'
      preprocessing:
      - type: REGEX
        parameters:
        - '{$UNIFI.API.AUTH.TOKEN}=([^;]+);'
        - \1
      - type: JAVASCRIPT
        parameters:
        - |
          try {
              var token = value;
              var req = new HttpRequest();
              req.addHeader('Accept: application/json');
              req.addHeader('x-api-key: {$APIKEY}');
              var resp = req.get('https://api.ui.com/v1/devices?hostId={$HOSTID}');
              if (req.getStatus() !== 200) throw 'cloud HTTP ' + req.getStatus();
              var cloud = JSON.parse(resp);
              cloud.token = token;
              return JSON.stringify(cloud);
          } catch(e) {
              Zabbix.log(4, '[UniFi host.session] ' + e);
              throw e;
          }
      tags:
      - tag: component
        value: raw
    - uuid: 6a8a3df76868425f95f7bac84319e26d
      name: 'Unifi API Raw: Hosts'
      type: HTTP_AGENT
      key: unifi.api.hosts
      history: 1h
      value_type: TEXT
      trends: '0'
      url: https://api.ui.com/v1/hosts/{$HOSTID}
      timeout: 15s
      headers:
      - name: Accept
        value: application/json
      - name: x-api-key
        value: '{$APIKEY}'
      tags:
      - tag: component
        value: raw
    - uuid: 0603751250184046947aebb8a7f8c9c1
      name: Local Raw (Combined)
      type: CALCULATED
      key: unifi.local.all
      delay: '{$UNIFI.CONSOLE.POLL.INTERVAL}'
      history: 1h
      value_type: TEXT
      trends: '0'
      params: last(//unifi.host.session)
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          try {
              if ('{$UNIFI.LOCAL.API.ENABLED}' === '0') {
                  throw 'local API disabled for this console ({$UNIFI.LOCAL.API.ENABLED}=0) - skipping local network calls';
              }
              var base = 'https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}';
              var token = null;

              try {
                  var cached = JSON.parse(value);
                  if (!cached || !cached.token) throw 'no cached token yet';
                  token = cached.token;
              } catch (e) {
                  token = null;
              }

              function fetchAll(tok) {
                  var req = new HttpRequest();
                  req.addHeader('Cookie: {$UNIFI.API.AUTH.TOKEN}=' + tok);
                  var health = req.get(base + '/{$UNIFI.API.URI}/health');
                  if (req.getStatus() !== 200) throw 'health HTTP ' + req.getStatus();
                  req.addHeader('Cookie: {$UNIFI.API.AUTH.TOKEN}=' + tok);
                  var device = req.get(base + '/{$UNIFI.API.URI}/device');
                  if (req.getStatus() !== 200) throw 'device HTTP ' + req.getStatus();
                  req.addHeader('Cookie: {$UNIFI.API.AUTH.TOKEN}=' + tok);
                  var shadow = req.get(base + '/{$UNIFI.API.REST.URI}/setting/shadow_mode');
                  if (req.getStatus() !== 200) shadow = '{"data":[{}]}';
                  req.addHeader('Cookie: {$UNIFI.API.AUTH.TOKEN}=' + tok);
                  var system = req.get(base + '/api/system');
                  if (req.getStatus() !== 200) system = '{"portStatus":[]}';
                  return {
                      health: JSON.parse(health),
                      device: JSON.parse(device),
                      shadow: JSON.parse(shadow),
                      system: JSON.parse(system)
                  };
              }

              var result;
              try {
                  if (!token) throw 'no cached token available yet';
                  result = fetchAll(token);
              } catch (e) {
                  // Cached token (from unifi.host.session's own slow refresh cycle) is
                  // missing or rejected - log in fresh, just for this one poll.
                  Zabbix.log(4, '[UniFi local.all] cached token rejected (' + e + '), requesting a fresh one');

                  var loginReq = new HttpRequest();
                  loginReq.addHeader('Content-Type: application/json');
                  loginReq.post(base + '/{$UNIFI.API.AUTH.URI}',
                      JSON.stringify({username: '{$UNIFI.USERNAME}', password: '{$UNIFI.PASSWORD}'}));
                  if (loginReq.getStatus() !== 200) throw 'fresh login HTTP ' + loginReq.getStatus();

                  var headers = loginReq.getHeaders();
                  var setCookie = null;
                  for (var h in headers) { if (h.toLowerCase() === 'set-cookie') { setCookie = headers[h]; break; } }
                  var m = setCookie && setCookie.match(/{$UNIFI.API.AUTH.TOKEN}=([^;]+);/);
                  if (!m) throw 'fresh login: no token in response headers';

                  result = fetchAll(m[1]);
              }

              return JSON.stringify(result);
          } catch(e) {
              Zabbix.log(4, '[UniFi local.all] ' + e);
              throw e;
          }
      tags:
      - tag: component
        value: raw
