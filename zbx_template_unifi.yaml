    macros:
    - macro: '{$APIKEY}'
      type: SECRET_TEXT
      description: API Key to access api.ui.com
    - macro: '{$BACKUP_INTERVAL}'
      value: 8d
      description: 'AutoBackup schedule (Daily: 2d, Weekly: 8d, Monthly: 32d). Set this to at least 1 day beyond backup schedule
        to prevent false positives. Default: 8d (weekly)'
    - macro: '{$WAN_UPTIME_NOTICE}'
      value: '99.9'
      description: '24h WAN availability WARNING threshold (%). Fire if <99.9% but >=WAN_UPTIME_WARN. Default: 99.9% (~1.4 min/day)'
    - macro: '{$WAN_UPTIME_WARN}'
      value: '99'
      description: '24h WAN availability AVERAGE threshold (%). Fire if <99% but >=0. Default: 99% (~14 min/day)'
    - macro: '{$WAN_UPTIME_HIGH}'
      value: '98'
      description: WAN availability high threshold (%). Fire if <98%.
    - macro: '{$UNIFI.WAN.LATENCY.WARN}'
      value: '100'
      description: WAN latency warning threshold (ms). UK home typical RTT is 10–30ms.
    - macro: '{$UNIFI.CONSOLE.OFFLINE.GRACE}'
      value: 3m
      description: 'How long the console must be continuously cloud-disconnected before "Console lost cloud connectivity"
        fires. Sized to ride out a WAN failover between two uplinks (typically 1-2 minutes of cloud disconnection)
        without alarming, while still catching a real outage quickly. Must be longer than the Connection State poll
        interval (1m) or the trigger can never fire. Default: 3m'
    - macro: '{$UNIFI.LOCAL.PORT}'
      value: '443'
      description: 'Local controller HTTPS port. 443 on UniFi OS consoles (UDM, CloudKey, UX); self-hosted UniFi
        OS Server uses 11443. Normally inherited from the root host''s default at discovery time, or set here to
        override for this host. Fallback value only, same reasoning as {$UNIFI.LOCAL.POLL.INTERVAL}.'
    - macro: '{$UNIFI.LOCAL.IP}'
      description: Local management IP of this console - populated from host discovery
    - macro: '{$UNIFI.LOCAL.API.ENABLED}'
      value: '1'
      description: 'Inherited from the root host''s default at discovery time, or set per console on that console''s host.
        Set to 0 on a console with no local network path from this Zabbix server (e.g. a cloud gateway with
        no local proxy) to skip local polling. This only stops network calls for "Local Raw (Combined)" and "Protect
        Bootstrap Raw" - both CALCULATED items where all HTTP calls happen in our own preprocessing, so we can check
        this macro before making any request. It cannot stop "Local Session + Cloud Devices Raw" (the session-token
        login POST) or the per-device local raw items (UAP/USW/UPS/RPS) from attempting their request: those are plain
        HTTP agent items whose request Zabbix fires before any preprocessing runs, so no template-side macro can gate
        them - they will keep trying and failing at whatever cadence {$UNIFI.LOCAL.POLL.INTERVAL} /
        {$UNIFI.SESSION.REFRESH.INTERVAL} / {$UNIFI.CONSOLE.POLL.INTERVAL} dictate. For a cloud-only console, raise
        those intervals (e.g. to 1h+) to make the unavoidable failures rare instead of constant. Device-level cloud-only
        offline detection (Ubiquiti UniFi Device template''s Status item) is unaffected either way - it only calls
        api.ui.com.'
    - macro: '{$UNIFI.USERNAME}'
      description: Local controller username - inherited from the root host's default at discovery time, or set here
        to override for this specific console
    - macro: '{$UNIFI.PASSWORD}'
      type: SECRET_TEXT
      description: Local controller password - inherited from the root host's default at discovery time, or set here
        to override for this specific console
    - macro: '{$UNIFI.LOCAL.POLL.INTERVAL}'
      value: 10s
      description: Local poll interval - normally inherited from the root host's default at discovery time, or set here
        to override for every device on this specific console. This value is only a fallback for before the first discovery
        cycle populates the real one; not a secret, so (unlike username/password) it's safe to give it a real default here.
    - macro: '{$UNIFI.CONSOLE.POLL.INTERVAL}'
      value: 3m
      description: Console combined local poll interval ("Local Raw (Combined)") - normally inherited from the root host's
        default at discovery time, or set here to override for this specific console. Fallback value only, same reasoning
        as {$UNIFI.LOCAL.POLL.INTERVAL} above.
    - macro: '{$UNIFI.SESSION.REFRESH.INTERVAL}'
      value: 10m
      description: Console session-token refresh interval ("Unifi API Raw", devices item) - normally inherited from the
        root host's default at discovery time, or set here to override for this specific console. Fallback value only,
        same reasoning as {$UNIFI.LOCAL.POLL.INTERVAL} above. See the root template's macro description for why 10m,
        not something closer to the ~2 hour session token lifetime, is the right default.
    - macro: '{$UNIFI.API.AUTH.URI}'
      value: api/auth/login
      description: Local controller login endpoint
    - macro: '{$UNIFI.API.AUTH.TOKEN}'
      value: TOKEN
      description: Cookie token name returned by local controller login
    - macro: '{$UNIFI.API.URI}'
      value: proxy/network/api/s/default/stat
      description: Local controller stat endpoint base path
    - macro: '{$UNIFI.API.REST.URI}'
      value: proxy/network/api/s/default/rest
      description: Local controller REST endpoint base path (settings, shadow_mode, etc.)
    - macro: '{$UNIFI.CPU.USAGE.WARN}'
      value: '80'
      description: CPU usage % WARNING threshold
    - macro: '{$UNIFI.CPU.USAGE.HIGH}'
      value: '90'
      description: CPU usage % HIGH threshold
    - macro: '{$UNIFI.MEM.USAGE.WARN}'
      value: '80'
      description: Memory usage % WARNING threshold
    - macro: '{$UNIFI.MEM.USAGE.HIGH}'
      value: '90'
      description: Memory usage % HIGH threshold
    - macro: '{$UNIFI.TEMP.WARN}'
      value: '70'
      description: Temperature °C WARNING threshold
    - macro: '{$UNIFI.TEMP.HIGH}'
      value: '80'
      description: Temperature °C HIGH threshold
    - macro: '{$UNIFI.SFP.TEMP.WARN}'
      value: '70'
      description: SFP module temperature warning threshold (°C). Active 10G SFP+ modules routinely run 60-65°C; 70°C indicates a genuinely elevated condition.
    - macro: '{$UNIFI.SFP.TEMP.HIGH}'
      value: '75'
      description: SFP module temperature critical threshold (°C). Commercial SFP+ modules are typically rated to 70°C; above this degradation and failure risk is high.
    - macro: '{$UNIFI.SFP.RXPOWER.LOW.WARN}'
      value: '-12'
      description: SFP RX power warning threshold (dBm). Below this level signal quality is degrading.
    - macro: '{$UNIFI.SFP.RXPOWER.LOW.HIGH}'
      value: '-16'
      description: SFP RX power critical threshold (dBm). Near receiver sensitivity limit for 10GBase-LR.
    - macro: '{$UNIFI.SFP.TXPOWER.LOW.WARN}'
      value: '-6'
      description: SFP TX power warning threshold (dBm). Below normal output for 10GBase-LR.
    - macro: '{$UNIFI.SFP.TXPOWER.LOW.HIGH}'
      value: '-9'
      description: SFP TX power critical threshold (dBm). Near minimum transmit spec for 10GBase-LR.
    - macro: '{$UNIFI.PORT.DROPPED.WINDOW}'
      value: 5m
      description: Time window for the RX/TX dropped-packet rate check (gateway and switch ports). A low, steady
        trickle of drops is normal on a real link, so these alarms fire on growth within this window exceeding
        {$UNIFI.PORT.DROPPED.WARN}, not on any single increase.
    - macro: '{$UNIFI.PORT.DROPPED.WARN}'
      value: '1000'
      description: RX/TX dropped-packet count threshold within {$UNIFI.PORT.DROPPED.WINDOW}. Starting default, not
        derived from a large sample of real links - tune per-host after observing your own normal baseline rate
        (Latest data > this port's RX/TX Dropped item) if this fires too often or not sensitively enough.
    - macro: '{$UNIFI.WAN.ENABLED}'
      value: '1'
      description: 'Controls both the unplugged and 0% uptime alarms for all WANs. Set context form {$UNIFI.WAN.ENABLED:WAN2}=0 on a host to suppress all alarms for that WAN (e.g. WAN2 not configured).'
    - macro: '{$UNIFI.WAN.ENABLED:WAN2}'
      value: '1'
      description: 'Default context for WAN2 - set to 0 on a host to suppress WAN2 unplugged and uptime alarms.'
    - macro: '{$UNIFI.PROTECT.API.URI}'
      value: proxy/protect/api
      description: Local Protect controller API base path
    - macro: '{$UNIFI.PROTECT.STORAGE.HIGH}'
      value: '99'
      description: Protect recording storage usage % HIGH threshold. Deliberately high and single-tier - continuous
        recording is designed to run near-full as a matter of course (automatically overwriting the oldest footage),
        so anything below this is normal steady-state, not a warning-worthy condition.
    - macro: '{$UNIFI.PROTECT.DISK.TEMP.WARN}'
      value: '60'
      description: Protect NVR spinning disk temperature WARNING threshold (°C). Deliberately separate from
        {$UNIFI.TEMP.WARN} - HDD media runs at different temperatures than gateway/network hardware.
    - macro: '{$UNIFI.PROTECT.DISK.TEMP.HIGH}'
      value: '70'
      description: Protect NVR spinning disk temperature HIGH threshold (°C).
