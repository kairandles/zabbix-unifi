      description: Local controller IP - set by host prototype
    - macro: '{$UNIFI.USERNAME}'
      description: Local controller username
    - macro: '{$UNIFI.PASSWORD}'
      type: SECRET_TEXT
      description: Local controller password
    - macro: '{$UNIFI.SESSION.TOKEN}'
      type: SECRET_TEXT
      description: Cached local controller session token, propagated from the parent console - set by host prototype
    - macro: '{$UNIFI.API.AUTH.URI}'
      value: api/auth/login
    - macro: '{$UNIFI.API.AUTH.TOKEN}'
      value: TOKEN
    - macro: '{$UNIFI.API.URI}'
      value: proxy/network/api/s/default/stat
    - macro: '{$UNIFI.LOCAL.POLL.INTERVAL}'
      value: 10s
      description: How often this device polls the local controller directly - normally inherited from the console's
        default unless overridden here. This value is only a fallback for before the first discovery cycle populates
        the real one. No login is attached to this poll (see the parent console's session token caching).
    - macro: '{$UNIFI.CPU.USAGE.WARN}'
      value: '80'
      description: CPU usage warning threshold (%).
    - macro: '{$UNIFI.CPU.USAGE.HIGH}'
      value: '90'
      description: CPU usage high threshold (%).
    - macro: '{$UNIFI.MEM.USAGE.WARN}'
      value: '80'
      description: Memory usage warning threshold (%).
    - macro: '{$UNIFI.MEM.USAGE.HIGH}'
      value: '90'
      description: Memory usage high threshold (%).
    - macro: '{$UNIFI.TEMP.WARN}'
      value: '55'
      description: Temperature warning threshold (°C).
    - macro: '{$UNIFI.TEMP.HIGH}'
      value: '65'
      description: Temperature high/critical threshold (°C).
    - macro: '{$UNIFI.UPTIME.WARN}'
      value: '24'
      description: Uptime warning threshold (hours). Fire if uptime < this value × 3600 seconds - default 24h.
  - uuid: ae887645c1f94cf7a5bcc02a5110494d
    template: Ubiquiti UniFi USW
    name: Ubiquiti UniFi USW
    description: |
      Local controller polling for UniFi Switches. Applied alongside Ubiquiti UniFi Device by host prototype
      discovery.

      Version: 1.6.0
    groups:
    - name: Templates
    items:
    - uuid: 1b4c7a2a9e8845f5ac8bc3a05813a254
      name: USW Device Raw
      type: HTTP_AGENT
      key: unifi.usw.device
      delay: '{$UNIFI.LOCAL.POLL.INTERVAL}'
      history: 1h
      value_type: TEXT
      trends: '0'
      url: https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.API.URI}/device
      timeout: 10s
      headers:
      - name: Cookie
        value: '{$UNIFI.API.AUTH.TOKEN}={$UNIFI.SESSION.TOKEN}'
      verify_peer: 'NO'
      verify_host: 'NO'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          try {
              var mac = '{$DEVICEMAC}';
              var macNorm = mac.replace(/:/g,'').toLowerCase();
              var d;

              try {
                  d = JSON.parse(value);
                  if (!d || !Array.isArray(d.data)) throw 'unexpected response shape';
              } catch (e) {
                  Zabbix.log(4, '[UniFi USW] cached token rejected (' + e + '), requesting a fresh one');

                  var loginReq = new HttpRequest();
                  loginReq.addHeader('Content-Type: application/json');
                  loginReq.post('https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.API.AUTH.URI}',
                      JSON.stringify({username: '{$UNIFI.USERNAME}', password: '{$UNIFI.PASSWORD}'}));
                  if (loginReq.getStatus() !== 200) throw 'fresh login HTTP ' + loginReq.getStatus();

                  var headers = loginReq.getHeaders();
                  var setCookie = null;
                  for (var h in headers) { if (h.toLowerCase() === 'set-cookie') { setCookie = headers[h]; break; } }
                  var m = setCookie && setCookie.match(/{$UNIFI.API.AUTH.TOKEN}=([^;]+);/);
                  if (!m) throw 'fresh login: no token in response headers';

                  var dataReq = new HttpRequest();
                  dataReq.addHeader('Cookie: {$UNIFI.API.AUTH.TOKEN}=' + m[1]);
                  var dataResp = dataReq.get('https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.API.URI}/device');
                  if (dataReq.getStatus() !== 200) throw 'fresh GET HTTP ' + dataReq.getStatus();
                  d = JSON.parse(dataResp);
                  if (!d || !Array.isArray(d.data)) throw 'fresh GET: unexpected response shape';
              }

              var dev = d.data.filter(function(x) { return x.mac && x.mac.replace(/:/g,'').toLowerCase() === macNorm; });
              return JSON.stringify({data: dev});
          } catch(e) {
              Zabbix.log(4, '[UniFi USW] ' + e);
              throw e;
          }
      tags:
      - tag: component
        value: raw
    - uuid: 7610a88375c54384ab5623bcf75f44cf
      name: State
      type: DEPENDENT
      key: unifi.usw.state
      delay: '0'
      history: 90d
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].state
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.usw.device
      tags:
      - tag: component
        value: usw
      triggers:
      - uuid: bbe2ee3a0ab34a9b8e7944f5ee31781c
        expression: last(/Ubiquiti UniFi USW/unifi.usw.state)<>1
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: last(/Ubiquiti UniFi USW/unifi.usw.state)=1
        name: '{HOST.NAME} offline - not seen by local controller'
        priority: HIGH
        dependencies:
        - name: '{HOST.NAME} is offline'
          expression: last(/Ubiquiti UniFi Device/unifi.api.device.offlineState)=1
          recovery_expression: last(/Ubiquiti UniFi Device/unifi.api.device.offlineState)=0
        description: The local UniFi controller is reporting this device as offline (state ≠ 1). The device may have 
          lost power, its uplink connection, or the controller has lost management reachability. This trigger is 
          suppressed if the cloud API is also reporting the device offline, to prevent duplicate alerts.
    - uuid: c08c59cba2af4b268ecc80214be1e31e
      name: CPU Usage
