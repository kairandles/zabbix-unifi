    - uuid: 47a289bbe5ef432ab26caceb098e478e
      name: Discover WAN Interfaces
      type: DEPENDENT
      key: unifi.discover.wans
      delay: '0'
      item_prototypes:
      - uuid: 14951a45bd6140baaed9d4b9a2b9d265
        name: WAN {#WANTYPE} Link Plugged
        type: DEPENDENT
        key: unifi.api.host.wan.plugged[{#WANTYPE}]
        delay: '0'
        history: 90d
        value_type: TEXT
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $..reportedState.wans[?(@.type=="{#WANTYPE}")].plugged.first()
        master_item:
          key: unifi.api.hosts
        tags:
        - tag: component
          value: Unifi WAN
        - tag: wan
          value: '{#WANTYPE}'
        trigger_prototypes:
        - uuid: ece6435a5d2f40d5940a23dc415b2b0d
          expression: find(/Ubiquiti UniFi API Host/unifi.api.host.wan.plugged[{#WANTYPE}],#3,"regexp","false")=2 and
            {$UNIFI.WAN.ENABLED:"{#WANTYPE}"}=1
          name: '{#WANTYPE} physically unplugged on {HOST.NAME}'
          priority: HIGH
          description: The {#WANTYPE} cable or SFP is physically disconnected from the gateway. To suppress this alarm
            for a WAN that is intentionally unused on a specific host, set the host-level macro
            {$UNIFI.WAN.ENABLED:WAN2}=0 (or the relevant WAN name). If this is a primary
            WAN, internet on this circuit is down - check the physical cable at the gateway and ISP equipment.
          manual_close: 'YES'
      - uuid: dad28e883bd84d3caa96884de0918b28
        name: WAN {#WANTYPE} Enabled
        type: DEPENDENT
        key: unifi.api.host.wan.enabled[{#WANTYPE}]
        delay: '0'
        history: 90d
        value_type: TEXT
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $..reportedState.wans[?(@.type=="{#WANTYPE}")].enabled.first()
        master_item:
          key: unifi.api.hosts
        tags:
        - tag: component
          value: Unifi WAN
        - tag: wan
          value: '{#WANTYPE}'
        trigger_prototypes:
        - uuid: 64e3576c431a489c8e4b4caf6e265df8
          expression: find(/Ubiquiti UniFi API Host/unifi.api.host.wan.enabled[{#WANTYPE}],#1,"regexp","false")=1
          name: '{#WANTYPE} administratively disabled on {HOST.NAME}'
          priority: WARNING
          description: The {#WANTYPE} interface has been disabled in UniFi config. If unintentional, re-enable it under 
            Settings > Internet. If secondary WAN, this removes failover capability.
          manual_close: 'YES'
      - uuid: 7404b573a75b47eab30704f3f577fc39
        name: WAN {#WANTYPE} IPv4 Address
        type: DEPENDENT
        key: unifi.api.host.wan.ipv4[{#WANTYPE}]
        delay: '0'
        history: 90d
        value_type: TEXT
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $..reportedState.wans[?(@.type=="{#WANTYPE}")].ipv4.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: ''
        - type: REGEX
          parameters:
          - \d+\.\d+\.\d+\.\d+
          - \0
          error_handler: DISCARD_VALUE
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
