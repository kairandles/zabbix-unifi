  - uuid: e1400fdb307647e1ad77662c37800555
    template: Ubiquiti UniFi RPS
    name: Ubiquiti UniFi RPS
    description: |
      Local controller polling for USP-RPS (Redundant Power Supply). Monitors PSU failover state - DISASTER
      fires when a connected device loses its primary PSU and the RPS takes over.

      Version: 1.6.0
    groups:
    - name: Templates
    items:
    - uuid: 2a2d0031fbaa4287a739ce69d3cd80b3
      name: RPS Device Raw
      type: HTTP_AGENT
      key: unifi.rps.device
      delay: '{$UNIFI.LOCAL.POLL.INTERVAL}'
      history: 1h
      value_type: TEXT
      trends: '0'
      url: https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.API.URI}/device
      timeout: 10s
      headers:
      - name: Cookie
        value: '{$UNIFI.API.AUTH.TOKEN}={$UNIFI.SESSION.TOKEN}'
      verify_peer: 'NO'
      verify_host: 'NO'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          try {
              var mac = '{$DEVICEMAC}';
              var macNorm = mac.replace(/:/g,'').toLowerCase();
              var d;

              try {
                  d = JSON.parse(value);
                  if (!d || !Array.isArray(d.data)) throw 'unexpected response shape';
              } catch (e) {
                  Zabbix.log(4, '[UniFi RPS] cached token rejected (' + e + '), requesting a fresh one');

                  var loginReq = new HttpRequest();
                  loginReq.addHeader('Content-Type: application/json');
                  loginReq.post('https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.API.AUTH.URI}',
                      JSON.stringify({username: '{$UNIFI.USERNAME}', password: '{$UNIFI.PASSWORD}'}));
                  if (loginReq.getStatus() !== 200) throw 'fresh login HTTP ' + loginReq.getStatus();

                  var headers = loginReq.getHeaders();
                  var setCookie = null;
                  for (var h in headers) { if (h.toLowerCase() === 'set-cookie') { setCookie = headers[h]; break; } }
                  var m = setCookie && setCookie.match(/{$UNIFI.API.AUTH.TOKEN}=([^;]+);/);
                  if (!m) throw 'fresh login: no token in response headers';

                  var dataReq = new HttpRequest();
                  dataReq.addHeader('Cookie: {$UNIFI.API.AUTH.TOKEN}=' + m[1]);
                  var dataResp = dataReq.get('https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.API.URI}/device');
                  if (dataReq.getStatus() !== 200) throw 'fresh GET HTTP ' + dataReq.getStatus();
                  d = JSON.parse(dataResp);
                  if (!d || !Array.isArray(d.data)) throw 'fresh GET: unexpected response shape';
              }

              var dev = d.data.filter(function(x) { return x.mac && x.mac.replace(/:/g,'').toLowerCase() === macNorm; });
              return JSON.stringify({data: dev});
          } catch(e) {
              Zabbix.log(4, '[UniFi RPS] ' + e);
              throw e;
          }
      tags:
      - tag: component
        value: raw
    - uuid: a3879ded0bd14846ac479acb8d4fe542
      name: State
      type: DEPENDENT
      key: unifi.rps.state
      delay: '0'
      history: 90d
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].state
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.rps.device
      tags:
      - tag: component
        value: rps
      triggers:
      - uuid: 6a492342ccee4822b11dbfbe9a8a00a8
        expression: last(/Ubiquiti UniFi RPS/unifi.rps.state)<>1
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: last(/Ubiquiti UniFi RPS/unifi.rps.state)=1
        name: '{HOST.NAME} offline - not seen by local controller'
        priority: HIGH
        dependencies:
        - name: '{HOST.NAME} is offline'
          expression: last(/Ubiquiti UniFi Device/unifi.api.device.offlineState)=1
          recovery_expression: last(/Ubiquiti UniFi Device/unifi.api.device.offlineState)=0
        description: The local UniFi controller is reporting this device as offline (state ≠ 1). The device may have 
          lost power, its uplink connection, or the controller has lost management reachability. This trigger is 
          suppressed if the cloud API is also reporting the device offline, to prevent duplicate alerts.
    - uuid: 1e5aecc76ea34f67880d40cd40bcac42
      name: CPU Usage
