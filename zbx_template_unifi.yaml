        description: Device memory has exceeded the critical threshold ({$UNIFI.MEM.USAGE.HIGH}%). The device may begin dropping new associations or behave 
          erratically. A reboot will typically recover memory; if the issue recurs, check for a firmware memory leak.
      - uuid: 36eb0f68d4524b998e791fce69e5c35d
        expression: last(/Ubiquiti UniFi UAP/unifi.uap.mem)>{$UNIFI.MEM.USAGE.WARN} and last(/Ubiquiti UniFi UAP/unifi.uap.mem)<={$UNIFI.MEM.USAGE.HIGH}
        name: '{HOST.NAME} memory high: {ITEM.LASTVALUE} (threshold: {$UNIFI.MEM.USAGE.WARN}%)'
        priority: WARNING
        description: Device memory usage is elevated above the warning threshold ({$UNIFI.MEM.USAGE.WARN}%). Monitor for further increases. A reboot may clear leaked
          memory if the issue persists without a clear cause.
    - uuid: 7992b619e57143ee9f2c8e3585a5b37b
      name: Uptime
      type: DEPENDENT
      key: unifi.uap.uptime
      delay: '0'
