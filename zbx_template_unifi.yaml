  - uuid: 226f2a3ed5884856b08373c9caff1bdf
    template: Ubiquiti UniFi UAP
    name: Ubiquiti UniFi UAP
    description: |
      Local controller polling for UniFi Access Points. Applied alongside Ubiquiti UniFi Device by host
      prototype discovery.

      Version: 1.6.0
    groups:
    - name: Templates
    items:
    - uuid: 0acd06e04d3c44be811b23a2e7b44d74
      name: UAP Device Raw
      type: HTTP_AGENT
      key: unifi.uap.device
      delay: '{$UNIFI.LOCAL.POLL.INTERVAL}'
      history: 1h
      value_type: TEXT
      trends: '0'
      url: https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.API.URI}/device
      timeout: 10s
      headers:
      - name: Cookie
        value: '{$UNIFI.API.AUTH.TOKEN}={$UNIFI.SESSION.TOKEN}'
      verify_peer: 'NO'
      verify_host: 'NO'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          try {
              var mac = '{$DEVICEMAC}';
              var macNorm = mac.replace(/:/g,'').toLowerCase();
              var d;

              try {
                  d = JSON.parse(value);
                  if (!d || !Array.isArray(d.data)) throw 'unexpected response shape';
              } catch (e) {
                  Zabbix.log(4, '[UniFi UAP] cached token rejected (' + e + '), requesting a fresh one');

                  var loginReq = new HttpRequest();
                  loginReq.addHeader('Content-Type: application/json');
                  loginReq.post('https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.API.AUTH.URI}',
                      JSON.stringify({username: '{$UNIFI.USERNAME}', password: '{$UNIFI.PASSWORD}'}));
                  if (loginReq.getStatus() !== 200) throw 'fresh login HTTP ' + loginReq.getStatus();

                  var headers = loginReq.getHeaders();
                  var setCookie = null;
                  for (var h in headers) { if (h.toLowerCase() === 'set-cookie') { setCookie = headers[h]; break; } }
                  var m = setCookie && setCookie.match(/{$UNIFI.API.AUTH.TOKEN}=([^;]+);/);
                  if (!m) throw 'fresh login: no token in response headers';

                  var dataReq = new HttpRequest();
                  dataReq.addHeader('Cookie: {$UNIFI.API.AUTH.TOKEN}=' + m[1]);
                  var dataResp = dataReq.get('https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.API.URI}/device');
                  if (dataReq.getStatus() !== 200) throw 'fresh GET HTTP ' + dataReq.getStatus();
                  d = JSON.parse(dataResp);
                  if (!d || !Array.isArray(d.data)) throw 'fresh GET: unexpected response shape';
              }

              var dev = d.data.filter(function(x) { return x.mac && x.mac.replace(/:/g,'').toLowerCase() === macNorm; });
              return JSON.stringify({data: dev});
          } catch(e) {
              Zabbix.log(4, '[UniFi UAP] ' + e);
              throw e;
          }
      tags:
      - tag: component
        value: raw
    - uuid: c08f7dd9bd524092819cedda383b67d3
      name: State
      type: DEPENDENT
      key: unifi.uap.state
      delay: '0'
      history: 90d
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].state
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.uap.device
      tags:
      - tag: component
        value: uap
      triggers:
      - uuid: a284c526cefe4d14bb5ad82ef30b416d
        expression: last(/Ubiquiti UniFi UAP/unifi.uap.state)<>1
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: last(/Ubiquiti UniFi UAP/unifi.uap.state)=1
        name: '{HOST.NAME} offline - not seen by local controller'
        priority: HIGH
        description: The local UniFi controller is reporting this device as offline (state ≠ 1). The device may have 
          lost power, its uplink connection, or the controller has lost management reachability. This trigger is 
          suppressed if the cloud API is also reporting the device offline, to prevent duplicate alerts.
        dependencies:
        - name: '{HOST.NAME} is offline'
          expression: last(/Ubiquiti UniFi Device/unifi.api.device.offlineState)=1
          recovery_expression: last(/Ubiquiti UniFi Device/unifi.api.device.offlineState)=0
    - uuid: 786d50d6e6c740c2ab29f35a05b7a3fb
      name: CPU Usage
      type: DEPENDENT
      key: unifi.uap.cpu
      delay: '0'
      history: 90d
      value_type: FLOAT
      units: '%'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0]["system-stats"].cpu
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: unifi.uap.device
      tags:
      - tag: component
        value: uap
      triggers:
      - uuid: 7491c47520324cc1a9e6a804ea63a0c0
        expression: last(/Ubiquiti UniFi UAP/unifi.uap.cpu)>{$UNIFI.CPU.USAGE.HIGH}
        name: '{HOST.NAME} CPU critical: {ITEM.LASTVALUE} (threshold: {$UNIFI.CPU.USAGE.HIGH}%)'
        priority: HIGH
        description: Device CPU has exceeded the critical threshold ({$UNIFI.CPU.USAGE.HIGH}%). At sustained high CPU the device may drop connections, slow 
          control-plane processing, or behave erratically. Check for firmware issues or an unusually high load, and 
          consider a reboot if the condition persists.
      - uuid: 027c6f0775414fa5be1ddb3bfd9ef8d6
        expression: last(/Ubiquiti UniFi UAP/unifi.uap.cpu)>{$UNIFI.CPU.USAGE.WARN} and last(/Ubiquiti UniFi UAP/unifi.uap.cpu)<={$UNIFI.CPU.USAGE.HIGH}
        name: '{HOST.NAME} CPU high: {ITEM.LASTVALUE} (threshold: {$UNIFI.CPU.USAGE.WARN}%)'
        priority: WARNING
        description: Device CPU usage is elevated above the warning threshold ({$UNIFI.CPU.USAGE.WARN}%). This is within operational tolerance but should be 
          monitored. Sustained high CPU can indicate heavy traffic, an active RF scan (on APs), or a firmware issue.
    - uuid: 3a39cd37d4154735b809388f34d8e38c
      name: Memory Usage
      type: DEPENDENT
