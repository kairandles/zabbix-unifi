        name: 'SD-WAN {HOST.NAME} config generation failed: {ITEM.LASTVALUE}'
        priority: HIGH
        description: The SD-WAN configuration could not be generated. Changes will not be pushed to sites and the last 
          known config remains active. Check for configuration conflicts in UniFi Site Manager.
    - uuid: cb48be19da2342ccb5b1ecb06a6d54b4
      name: Disconnected Tunnels
      type: DEPENDENT
      key: unifi.sdwan.disconnectedTunnels
      delay: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var data = JSON.parse(value).data;
          var count = 0;
          var nodes = (data.hubs || []).concat(data.spokes || []);
          for (var i = 0; i < nodes.length; i++) {
              var conns = nodes[i].connections || [];
              for (var j = 0; j < conns.length; j++) {
                  var tunnels = conns[j].tunnels || [];
                  for (var k = 0; k < tunnels.length; k++) {
                      if (tunnels[k].status !== 'connected') count++;
                  }
              }
          }
          return count;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.sdwan.status
      tags:
      - tag: component
        value: sdwan
      triggers:
      - uuid: b773d6bd04274e2ea29c3bdc00f90a16
        expression: last(/Ubiquiti UniFi SD-WAN/unifi.sdwan.disconnectedTunnels)>0
        name: 'SD-WAN {HOST.NAME}: {ITEM.LASTVALUE} tunnel(s) disconnected'
        priority: HIGH
        description: 'One or more SD-WAN tunnels are not connected but at least one path likely remains. Inter-site
          traffic may be degraded. Check spoke WAN interface triggers to identify which circuit dropped. Escalates to
          DISASTER if a spoke loses all tunnels (isolated spokes trigger).'
    - uuid: c89a413789224d6a8d3886d5fb260a07
      name: Isolated Spokes
      type: DEPENDENT
      key: unifi.sdwan.isolatedSpokes
      delay: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var data = JSON.parse(value).data;
          var count = 0;
          var spokes = data.spokes || [];
          for (var i = 0; i < spokes.length; i++) {
              var conns = spokes[i].connections || [];
              var connected = 0;
              for (var j = 0; j < conns.length; j++) {
                  var tunnels = conns[j].tunnels || [];
                  for (var k = 0; k < tunnels.length; k++) {
                      if (tunnels[k].status === 'connected') connected++;
                  }
              }
              if (connected === 0) count++;
          }
          return count;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.sdwan.status
      tags:
      - tag: component
        value: sdwan
      triggers:
      - uuid: b6484d60b85f4173904f06ddc58b9004
        expression: last(/Ubiquiti UniFi SD-WAN/unifi.sdwan.isolatedSpokes)>0
        name: 'SD-WAN {HOST.NAME}: {ITEM.LASTVALUE} spoke(s) completely isolated - all tunnels down'
        priority: DISASTER
        description: 'One or more spoke sites have lost every SD-WAN tunnel. The spoke is fully cut off from all hub sites.
          A single WAN going down on a dual-WAN spoke would only drop one tunnel (leaving the other active) and would
          not fire this alarm - so if this fires, ALL WANs on that spoke are unreachable. Check the spoke site WAN
          triggers and ISP status immediately.'
    - uuid: 90fe35b7e3cc4ae29665deb1296cdc42
      name: Disconnected Hubs
      type: DEPENDENT
      key: unifi.sdwan.disconnectedHubs
      delay: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var data = JSON.parse(value).data;
          var hubs = data.hubs || [];
          var spokes = data.spokes || [];
          var count = 0;
          for (var i = 0; i < hubs.length; i++) {
              var hubId = hubs[i].id;
              var hasConnectedSpoke = false;
              for (var j = 0; j < spokes.length; j++) {
                  var conns = spokes[j].connections || [];
                  for (var k = 0; k < conns.length; k++) {
                      if (conns[k].hubId !== hubId) continue;
                      var tunnels = conns[k].tunnels || [];
                      for (var m = 0; m < tunnels.length; m++) {
                          if (tunnels[m].status === 'connected') { hasConnectedSpoke = true; break; }
                      }
                      if (hasConnectedSpoke) break;
                  }
                  if (hasConnectedSpoke) break;
              }
              if (!hasConnectedSpoke) count++;
          }
          return count;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.sdwan.status
      tags:
      - tag: component
        value: sdwan
      triggers:
      - uuid: cc1d8c26e39d4363a58d9f906245d1d3
        expression: last(/Ubiquiti UniFi SD-WAN/unifi.sdwan.disconnectedHubs)>0
        name: 'SD-WAN {HOST.NAME}: {ITEM.LASTVALUE} hub(s) have no active spoke connections'
        priority: DISASTER
        description: 'A hub site has lost all SD-WAN spoke connections. No spoke sites can reach this hub, meaning
          all inter-site traffic routed through it is down. Check the hub gateway WAN link and its cloud connectivity.
          If the hub WAN is up, check for SD-WAN config or certificate issues in UniFi Site Manager.'
    - uuid: a62f0d0ccd7646ab9543281a5ade0469
      name: Hub WAN Internet Issues
      type: DEPENDENT
      key: unifi.sdwan.hubWanIssues
      delay: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var data = JSON.parse(value).data;
          var count = 0;
          var hubs = data.hubs || [];
          for (var i = 0; i < hubs.length; i++) {
              var p = hubs[i].primaryWanStatus || {};
              var s = hubs[i].secondaryWanStatus || {};
              if (p.internetIssues && p.internetIssues.length > 0) count++;
              if (s.internetIssues && s.internetIssues.length > 0) count++;
          }
          return count;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.sdwan.status
      tags:
      - tag: component
        value: sdwan
      triggers:
      - uuid: de8109c1b4c54bf786243567ef10d657
        expression: last(/Ubiquiti UniFi SD-WAN/unifi.sdwan.hubWanIssues)>0
        name: 'SD-WAN {HOST.NAME}: hub site WAN issues detected'
        priority: HIGH
        description: A hub site is reporting WAN internet issues. This may affect all spoke sites tunnelling through it.
          Check hub gateway WAN interface triggers and ISP status.
    - uuid: 3296a4ff32da45468da7e8efa0441c2c
      name: Spoke WAN Internet Issues
      type: DEPENDENT
      key: unifi.sdwan.spokeWanIssues
      delay: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var data = JSON.parse(value).data;
          var count = 0;
          var spokes = data.spokes || [];
          for (var i = 0; i < spokes.length; i++) {
              var p = spokes[i].primaryWanStatus || {};
              var s = spokes[i].secondaryWanStatus || {};
              if (p.internetIssues && p.internetIssues.length > 0) count++;
              if (s.internetIssues && s.internetIssues.length > 0) count++;
          }
          return count;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.sdwan.status
      tags:
      - tag: component
        value: sdwan
      triggers:
      - uuid: a2383699354f40e2b4b2b32747cca9d0
        expression: last(/Ubiquiti UniFi SD-WAN/unifi.sdwan.spokeWanIssues)>0
        name: 'SD-WAN {HOST.NAME}: spoke site WAN issues detected'
        priority: HIGH
        description: A spoke site is reporting WAN internet issues. Inter-site connectivity may be degraded. Check the 
          site-level WAN downtime triggers to identify which spoke and which circuit is affected.
    macros:
