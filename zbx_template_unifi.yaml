    macros:
    - macro: '{$DEVICEID}'
      description: Device MAC - set by host prototype
    - macro: '{$UNIFI.LOCAL.PORT}'
      value: '443'
      description: 'Local controller HTTPS port. 443 on UniFi OS consoles (UDM, CloudKey, UX); self-hosted UniFi
        OS Server uses 11443. Normally inherited from the root host''s default at discovery time, or set here to
        override for this host. Fallback value only, same reasoning as {$UNIFI.LOCAL.POLL.INTERVAL}.'
    - macro: '{$UNIFI.LOCAL.IP}'
      description: Local controller IP - set by host prototype
    - macro: '{$UNIFI.USERNAME}'
      description: Local controller username
    - macro: '{$UNIFI.PASSWORD}'
      type: SECRET_TEXT
      description: Local controller password
    - macro: '{$UNIFI.SESSION.TOKEN}'
      type: SECRET_TEXT
      description: Cached local controller session token, propagated from the parent console - set by host prototype
    - macro: '{$UNIFI.API.AUTH.URI}'
      value: api/auth/login
    - macro: '{$UNIFI.API.AUTH.TOKEN}'
      value: TOKEN
    - macro: '{$UNIFI.API.URI}'
      value: proxy/network/api/s/default/stat
    - macro: '{$UNIFI.LOCAL.POLL.INTERVAL}'
      value: 10s
      description: How often this device polls the local controller directly - normally inherited from the console's
        default unless overridden here. This value is only a fallback for before the first discovery cycle populates
        the real one. No login is attached to this poll (see the parent console's session token caching).
    - macro: '{$UNIFI.CPU.USAGE.WARN}'
      value: '80'
      description: CPU usage warning threshold (%).
    - macro: '{$UNIFI.CPU.USAGE.HIGH}'
      value: '90'
      description: CPU usage high threshold (%).
    - macro: '{$UNIFI.MEM.USAGE.WARN}'
      value: '80'
      description: Memory usage warning threshold (%).
    - macro: '{$UNIFI.MEM.USAGE.HIGH}'
      value: '90'
      description: Memory usage high threshold (%).
    - macro: '{$UNIFI.TEMP.WARN}'
      value: '55'
      description: Temperature warning threshold (°C).
    - macro: '{$UNIFI.TEMP.HIGH}'
      value: '65'
      description: Temperature high/critical threshold (°C).
    - macro: '{$UNIFI.UPTIME.WARN}'
      value: '24'
      description: Uptime warning threshold (hours). Fire if uptime < this value × 3600 seconds - default 24h.
    - macro: '{$UNIFI.SFP.TEMP.WARN}'
      value: '70'
      description: SFP module temperature warning threshold (°C). Active 10G SFP+ modules routinely run 60-65°C; 70°C indicates a genuinely elevated condition.
    - macro: '{$UNIFI.SFP.TEMP.HIGH}'
      value: '75'
      description: SFP module temperature critical threshold (°C). Commercial SFP+ modules are typically rated to 70°C; above this degradation and failure risk is high.
    - macro: '{$UNIFI.SFP.RXPOWER.LOW.WARN}'
      value: '-12'
      description: SFP RX power warning threshold (dBm). Below this level signal quality is degrading.
    - macro: '{$UNIFI.SFP.RXPOWER.LOW.HIGH}'
      value: '-16'
      description: SFP RX power critical threshold (dBm). Near receiver sensitivity limit for 10GBase-LR.
    - macro: '{$UNIFI.SFP.TXPOWER.LOW.WARN}'
      value: '-6'
      description: SFP TX power warning threshold (dBm). Below normal output for 10GBase-LR.
    - macro: '{$UNIFI.SFP.TXPOWER.LOW.HIGH}'
      value: '-9'
      description: SFP TX power critical threshold (dBm). Near minimum transmit spec for 10GBase-LR.
    - macro: '{$UNIFI.PORT.DROPPED.WINDOW}'
      value: 5m
      description: Time window for the RX/TX dropped-packet rate check. A low, steady trickle of drops is normal on
        a real link, so this alarm fires on growth within this window exceeding {$UNIFI.PORT.DROPPED.WARN}, not on
        any single increase.
    - macro: '{$UNIFI.PORT.DROPPED.WARN}'
      value: '1000'
      description: RX/TX dropped-packet count threshold within {$UNIFI.PORT.DROPPED.WINDOW}. Starting default, not
        derived from a large sample of real links - tune per-host after observing your own normal baseline rate
        (Latest data > this port's RX/TX Dropped item) if this fires too often or not sensitively enough.
  - uuid: ed8f0edb07ac4bdcbd4a698d2df76649
    template: Ubiquiti UniFi UPS
    name: Ubiquiti UniFi UPS
    description: |
      Local controller polling for USW-Deployed-24 (USWDA) with battery backup. Applied alongside Ubiquiti
      UniFi Device by host prototype discovery.

      Version: 1.6.0
    groups:
    - name: Templates
    items:
    - uuid: 151d95c08de641369ab4a2edbedb5c7f
      name: UPS Device Raw
      type: HTTP_AGENT
      key: unifi.ups.device
      delay: '{$UNIFI.LOCAL.POLL.INTERVAL}'
      history: 1h
      value_type: TEXT
      trends: '0'
      url: https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.API.URI}/device
      timeout: 10s
      headers:
      - name: Cookie
        value: '{$UNIFI.API.AUTH.TOKEN}={$UNIFI.SESSION.TOKEN}'
      verify_peer: 'NO'
      verify_host: 'NO'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          try {
              var mac = '{$DEVICEMAC}';
              var macNorm = mac.replace(/:/g,'').toLowerCase();
              var d;

              try {
                  d = JSON.parse(value);
                  if (!d || !Array.isArray(d.data)) throw 'unexpected response shape';
              } catch (e) {
                  Zabbix.log(4, '[UniFi UPS] cached token rejected (' + e + '), requesting a fresh one');

                  var loginReq = new HttpRequest();
                  loginReq.addHeader('Content-Type: application/json');
                  loginReq.post('https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.API.AUTH.URI}',
                      JSON.stringify({username: '{$UNIFI.USERNAME}', password: '{$UNIFI.PASSWORD}'}));
                  if (loginReq.getStatus() !== 200) throw 'fresh login HTTP ' + loginReq.getStatus();

                  var headers = loginReq.getHeaders();
                  var setCookie = null;
                  for (var h in headers) { if (h.toLowerCase() === 'set-cookie') { setCookie = headers[h]; break; } }
                  var m = setCookie && setCookie.match(/{$UNIFI.API.AUTH.TOKEN}=([^;]+);/);
                  if (!m) throw 'fresh login: no token in response headers';

                  var dataReq = new HttpRequest();
                  dataReq.addHeader('Cookie: {$UNIFI.API.AUTH.TOKEN}=' + m[1]);
                  var dataResp = dataReq.get('https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.API.URI}/device');
                  if (dataReq.getStatus() !== 200) throw 'fresh GET HTTP ' + dataReq.getStatus();
                  d = JSON.parse(dataResp);
                  if (!d || !Array.isArray(d.data)) throw 'fresh GET: unexpected response shape';
              }

              var dev = d.data.filter(function(x) { return x.mac && x.mac.replace(/:/g,'').toLowerCase() === macNorm; });
              return JSON.stringify({data: dev});
          } catch(e) {
              Zabbix.log(4, '[UniFi UPS] ' + e);
              throw e;
          }
      tags:
      - tag: component
        value: raw
    - uuid: 0ab286af12c84d95bd05be35a031ae7d
      name: State
      type: DEPENDENT
      key: unifi.ups.state
      delay: '0'
      history: 90d
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].state
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.ups.device
      tags:
      - tag: component
        value: ups
      triggers:
      - uuid: af4f82d3a48c4a42b0d2546947357f13
        expression: last(/Ubiquiti UniFi UPS/unifi.ups.state)<>1
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: last(/Ubiquiti UniFi UPS/unifi.ups.state)=1
        name: '{HOST.NAME} offline - not seen by local controller'
        priority: HIGH
        dependencies:
        - name: '{HOST.NAME} is offline'
          expression: last(/Ubiquiti UniFi Device/unifi.api.device.offlineState)=1
          recovery_expression: last(/Ubiquiti UniFi Device/unifi.api.device.offlineState)=0
        description: The local UniFi controller is reporting this device as offline (state ≠ 1). The device may have 
          lost power, its uplink connection, or the controller has lost management reachability. This trigger is 
          suppressed if the cloud API is also reporting the device offline, to prevent duplicate alerts.
    - uuid: 8cfbbbe2975b4d93b6b4df76cb4e044b
      name: CPU Usage
      type: DEPENDENT
