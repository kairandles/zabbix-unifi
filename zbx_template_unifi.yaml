  - uuid: e8d794ca511645b7857de6a244466a6f
    template: Ubiquiti UniFi Protect Device
    name: Ubiquiti UniFi Protect Device
    description: |
      Local Protect controller polling for miscellaneous Protect devices that don't have a dedicated template
      (chimes today; sensors/lights/sirens/viewers if adopted later). Discovered by "Discover Host Protect Other"
      on Ubiquiti UniFi API Host. Common health fields only - no recording-specific items, since these device
      types have no recording concept. Reuses the same session token already cached by that console's
      unifi.host.session item - no separate login or credentials of its own.

      Version: 1.6.0
    groups:
    - name: Templates
    items:
    - uuid: d7d1dcc415454e4b827a76eb58b188f5
      name: Protect Other Device Raw
      type: HTTP_AGENT
      key: unifi.protect.other.device
      delay: '{$UNIFI.LOCAL.POLL.INTERVAL}'
      history: 1h
      value_type: TEXT
      trends: '0'
      url: https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.PROTECT.API.URI}/bootstrap
      timeout: 10s
      headers:
      - name: Cookie
        value: '{$UNIFI.API.AUTH.TOKEN}={$UNIFI.SESSION.TOKEN}'
      verify_peer: 'NO'
      verify_host: 'NO'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          try {
              var mac = '{$DEVICEMAC}';
              var macNorm = mac.replace(/:/g,'').toLowerCase();
              var d;

              function findDevice(obj) {
                  var all = []
                      .concat(obj.chimes || [])
                      .concat(obj.sensors || [])
                      .concat(obj.lights || [])
                      .concat(obj.sirens || [])
                      .concat(obj.viewers || []);
                  return all.filter(function(x) { return x.mac && x.mac.replace(/:/g,'').toLowerCase() === macNorm; });
              }

              try {
                  d = JSON.parse(value);
                  if (!d) throw 'unexpected response shape';
              } catch (e) {
                  Zabbix.log(4, '[UniFi Protect Other] cached token rejected (' + e + '), requesting a fresh one');

                  var loginReq = new HttpRequest();
                  loginReq.addHeader('Content-Type: application/json');
                  loginReq.post('https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.API.AUTH.URI}',
                      JSON.stringify({username: '{$UNIFI.USERNAME}', password: '{$UNIFI.PASSWORD}'}));
                  if (loginReq.getStatus() !== 200) throw 'fresh login HTTP ' + loginReq.getStatus();

                  var headers = loginReq.getHeaders();
                  var setCookie = null;
                  for (var h in headers) { if (h.toLowerCase() === 'set-cookie') { setCookie = headers[h]; break; } }
                  var m = setCookie && setCookie.match(/{$UNIFI.API.AUTH.TOKEN}=([^;]+);/);
                  if (!m) throw 'fresh login: no token in response headers';

                  var dataReq = new HttpRequest();
                  dataReq.addHeader('Cookie: {$UNIFI.API.AUTH.TOKEN}=' + m[1]);
                  var dataResp = dataReq.get('https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}/{$UNIFI.PROTECT.API.URI}/bootstrap');
                  if (dataReq.getStatus() !== 200) throw 'fresh GET HTTP ' + dataReq.getStatus();
                  d = JSON.parse(dataResp);
                  if (!d) throw 'fresh GET: unexpected response shape';
              }

              var dev = findDevice(d);
              return JSON.stringify({data: dev});
          } catch(e) {
              Zabbix.log(4, '[UniFi Protect Other] ' + e);
              throw e;
          }
      tags:
      - tag: component
        value: raw
    - uuid: d88b70a3f4404384ac5a8a28eab3d618
      name: Device State
      type: DEPENDENT
      key: unifi.protect.other.state
