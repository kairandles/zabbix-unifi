    - uuid: 009605586b58481cb36bdf0e0c0ba3aa
      name: Protect Bootstrap Raw
      type: CALCULATED
      key: unifi.protect.bootstrap
      delay: '{$UNIFI.CONSOLE.POLL.INTERVAL}'
      history: 1h
      value_type: TEXT
      trends: '0'
      params: last(//unifi.host.session)
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          try {
              var base = 'https://{$UNIFI.LOCAL.IP}:{$UNIFI.LOCAL.PORT}';
              var token = null;

              try {
                  var cached = JSON.parse(value);
                  if (!cached || !cached.token) throw 'no cached token yet';
                  token = cached.token;
              } catch (e) {
                  token = null;
              }

              function tryFetch(tok) {
                  var req = new HttpRequest();
                  req.addHeader('Cookie: {$UNIFI.API.AUTH.TOKEN}=' + tok);
                  var resp = req.get(base + '/{$UNIFI.PROTECT.API.URI}/bootstrap');
                  return {status: req.getStatus(), body: resp};
              }

              var usedToken = token;
              var res = token ? tryFetch(token) : {status: 0, body: null};

              if (res.status === 404) {
                  // Protect isn't installed on this console at all - nothing to report, not an error.
                  return JSON.stringify({nvr: null, cameras: [], chimes: [], token: usedToken});
              }
              if (res.status === 403) {
                  throw 'protect bootstrap HTTP 403 - this account is missing Protect permission (UniFi OS > ' +
                      'Admins & Users > this user > enable Protect access, then re-save the role)';
              }
              if (res.status !== 200) {
                  // Cached token missing/rejected or some other transient failure - try one fresh login.
                  Zabbix.log(4, '[UniFi protect.bootstrap] cached attempt failed (status ' + res.status + '), requesting a fresh login');

                  var loginReq = new HttpRequest();
                  loginReq.addHeader('Content-Type: application/json');
                  loginReq.post(base + '/{$UNIFI.API.AUTH.URI}',
                      JSON.stringify({username: '{$UNIFI.USERNAME}', password: '{$UNIFI.PASSWORD}'}));
                  if (loginReq.getStatus() !== 200) throw 'fresh login HTTP ' + loginReq.getStatus();

                  var headers = loginReq.getHeaders();
                  var setCookie = null;
                  for (var h in headers) { if (h.toLowerCase() === 'set-cookie') { setCookie = headers[h]; break; } }
                  var m = setCookie && setCookie.match(/{$UNIFI.API.AUTH.TOKEN}=([^;]+);/);
                  if (!m) throw 'fresh login: no token in response headers';

                  usedToken = m[1];
                  res = tryFetch(m[1]);
                  if (res.status === 404) {
                      return JSON.stringify({nvr: null, cameras: [], chimes: [], token: usedToken});
                  }
                  if (res.status === 403) {
                      throw 'protect bootstrap HTTP 403 after fresh login - this account is missing Protect permission (UniFi OS > ' +
                          'Admins & Users > this user > enable Protect access, then re-save the role)';
                  }
                  if (res.status !== 200) {
                      throw 'protect bootstrap HTTP ' + res.status + ' after fresh login';
                  }
              }

              var result;
              try {
                  result = JSON.parse(res.body);
              } catch (e) {
                  // Some consoles return HTTP 200 with a non-JSON body from this endpoint when
                  // Protect isn't installed, rather than a 404 - treat it the same way.
                  return JSON.stringify({nvr: null, cameras: [], chimes: [], token: usedToken});
              }
              result.token = usedToken;
              return JSON.stringify(result);
          } catch(e) {
              Zabbix.log(4, '[UniFi protect.bootstrap] ' + e);
              throw e;
          }
      tags:
      - tag: component
        value: raw
    discovery_rules:
    - uuid: 295f0839888f4c6ab38c8c2cc623a38b
      name: Discover Protect NVR
      type: DEPENDENT
      key: unifi.protect.nvr.discovery
      delay: '0'
      item_prototypes:
      - uuid: 029daac61e0543838f6341d9e53ef954
        name: Protect Application Version
        type: DEPENDENT
        key: unifi.protect.nvr.version[{#NVR}]
        delay: '0'
        history: 1h
        trends: '0'
        value_type: TEXT
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.nvr.version
          error_handler: CUSTOM_VALUE
          error_handler_params: ''
        master_item:
          key: unifi.protect.bootstrap
        tags:
        - tag: component
          value: protect-nvr
      - uuid: 8d5fbe209c4a47709ddc3e817b18ec4f
        name: Protect Database Corruption State
        type: DEPENDENT
        key: unifi.protect.nvr.corruptionstate[{#NVR}]
        delay: '0'
        history: 1h
        trends: '0'
        value_type: TEXT
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.nvr.corruptionState
          error_handler: CUSTOM_VALUE
          error_handler_params: healthy
        master_item:
          key: unifi.protect.bootstrap
        tags:
        - tag: component
          value: protect-nvr
        trigger_prototypes:
        - uuid: 25b90456f198403bbb9d1147a8702d0d
          expression: find(/Ubiquiti UniFi API Host/unifi.protect.nvr.corruptionstate[{#NVR}],#1,"regexp","healthy")<>1
          name: '{HOST.NAME} Protect database corruption detected (state: {ITEM.LASTVALUE})'
          priority: HIGH
          description: UniFi Protect is reporting its recording database in a non-healthy state. Recording and playback
            may be unreliable until this is resolved. Check the Protect application's storage/system status in the
            UniFi OS dashboard; a rebuild or storage replacement may be required.
      - uuid: fe97cdc13609407f9f4e633d93d7f0d6
        name: Protect Hard Drive Compatibility State
        type: DEPENDENT
        key: unifi.protect.nvr.harddrivestate[{#NVR}]
        delay: '0'
        history: 1h
        trends: '0'
        value_type: TEXT
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.nvr.hardDriveState
          error_handler: CUSTOM_VALUE
          error_handler_params: ''
        master_item:
          key: unifi.protect.bootstrap
        tags:
        - tag: component
          value: protect-nvr
        trigger_prototypes:
        - uuid: a8559f2c6e4242e3a6e68ecf825cab07
          expression: find(/Ubiquiti UniFi API Host/unifi.protect.nvr.harddrivestate[{#NVR}],#1,"regexp","hddNotCompatible")=1
          name: '{HOST.NAME} Protect storage drive not officially compatible'
          priority: INFO
          manual_close: 'YES'
          description: UniFi Protect reports the installed hard drive as not on its compatibility list. This is a
            compatibility/support notice, not an indicator of an active fault - a drive can run this way indefinitely
            with no real issues, so this is informational only. Cross-check the per-disk Health/State/Bad Sectors
            items on this same host for actual drive health signals. Only this one known-bad value is denylisted here
            since no confirmed "healthy" string has been observed live; the change() safety-net trigger below will
            surface any other value seen.
        - uuid: 4fbe07ffe76e4b7893231777d14d0b8f
          expression: change(/Ubiquiti UniFi API Host/unifi.protect.nvr.harddrivestate[{#NVR}])=1
          name: '{HOST.NAME} Protect hard drive state changed to {ITEM.LASTVALUE}'
          priority: INFO
          manual_close: 'YES'
          description: The reported hard drive compatibility/health state changed. Informational safety net so any
            transition is visible even for values not yet explicitly handled by a dedicated trigger.
      - uuid: 08a4bed83b384a7cbf6ee88ff8eef6fa
        name: Protect Camera License Capacity State
        type: DEPENDENT
        key: unifi.protect.nvr.cameracapacitystate[{#NVR}]
        delay: '0'
        history: 1h
        trends: '0'
        value_type: TEXT
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.nvr.cameraCapacity.state
          error_handler: CUSTOM_VALUE
          error_handler_params: ok
        master_item:
          key: unifi.protect.bootstrap
        tags:
        - tag: component
          value: protect-nvr
        trigger_prototypes:
        - uuid: 134fd4ce7d0444e897ac21c074477ba7
          expression: find(/Ubiquiti UniFi API Host/unifi.protect.nvr.cameracapacitystate[{#NVR}],#1,"regexp","ok")<>1
          name: '{HOST.NAME} Protect camera license capacity not ok (state: {ITEM.LASTVALUE})'
          priority: WARNING
          description: UniFi Protect reports its camera license/capacity state as something other than "ok" - this
            NVR may be over its supported camera count for the resolutions in use. Check the Protect dashboard's
            camera capacity/licensing panel.
      - uuid: eeaf7abbdd3f43a5ad6feecc180a76ef
        name: Protect Camera License Utilization
        type: DEPENDENT
        key: unifi.protect.nvr.camerautilization[{#NVR}]
        delay: '0'
        history: 1h
        trends: 365d
        value_type: FLOAT
        units: '%'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.nvr.cameraUtilization
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        - type: JAVASCRIPT
          parameters:
          - |
            // A JSON null resolves the JSONPath step above successfully (as the
            // literal string "null"), so error_handler/CUSTOM_VALUE never triggers.
            return (value === 'null' || value === '') ? '0' : value;
        master_item:
          key: unifi.protect.bootstrap
        tags:
        - tag: component
          value: protect-nvr
      - uuid: 4d076152ace8476d890fd418140e9799
        name: Protect Storage Utilization
        type: DEPENDENT
        key: unifi.protect.nvr.storageutilization[{#NVR}]
        delay: '0'
        history: 1h
        trends: 365d
        value_type: FLOAT
        units: '%'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.nvr.storageStats.utilization
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        - type: JAVASCRIPT
          parameters:
          - |
            // A JSON null resolves the JSONPath step above successfully (as the
            // literal string "null"), so error_handler/CUSTOM_VALUE never triggers.
            return (value === 'null' || value === '') ? '0' : value;
        master_item:
