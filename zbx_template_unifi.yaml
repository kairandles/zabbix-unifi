      type: SECRET_TEXT
      description: API Key to access api.ui.com
    - macro: '{$SDWANID}'
      description: SD-WAN Config ID - set automatically by host prototype discovery
  - uuid: 55b1c6055ff747ddb9b37eab60704ee2
    template: Ubiquiti UniFi Device
    name: Ubiquiti UniFi Device
    description: |
      Applied to individual UniFi device hosts discovered by Ubiquiti UniFi API Host.
      Monitors device status, firmware, version, uptime, and IP via cloud API.
      Macros {$HOSTID} and {$DEVICEID} are set automatically by the discovering gateway's host prototype.

      Version: 1.6.0

      Template available at https://github.com/kairandles/zabbix-unifi
    groups:
    - name: Templates
    items:
    - uuid: a71c4e104be5442d9fb649dec7fa61c3
      name: 'Unifi API Raw: Device'
      type: HTTP_AGENT
      key: unifi.api.device.raw
      delay: 1m
      history: 1h
      value_type: TEXT
      trends: '0'
      url: https://api.ui.com/v1/devices?hostId={$HOSTID}
      timeout: 15s
      headers:
      - name: Accept
        value: application/json
      - name: x-api-key
        value: '{$APIKEY}'
      tags:
      - tag: component
        value: raw
    - uuid: 30bcef8871434615840e70993ec0078d
      name: Status
      type: DEPENDENT
      key: unifi.api.device.status
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var id = '{$DEVICEID}';
          var hostId = '{$HOSTID}';
          for (var i = 0; i < d.data.length; i++) {
              if (d.data[i].hostId !== hostId) continue;
              var devs = d.data[i].devices || [];
              for (var j = 0; j < devs.length; j++) {
                  if (devs[j].id === id) return devs[j].status || 'unknown';
              }
          }
          return 'unknown';
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.api.device.raw
      tags:
      - tag: component
        value: device
    - uuid: 457e86831062444bbe827b99a0da120f
      name: Offline State
      type: DEPENDENT
      key: unifi.api.device.offlineState
      delay: '0'
      history: 90d
      trends: '0'
      description: 'Alert-ready offline state computed from a single /v1/devices payload: 0 = device online (or not in
        the payload), 1 = device offline while its console still reads online (a genuine single-device failure - the
        cloud can see the site fine and this device is gone), 2 = device offline but the console itself also reads
        offline (the cloud has lost sight of the whole site, so per-device statuses are meaningless - typically a site
        WAN outage or failover in progress). Both statuses come from the same payload of the same master item, so the
        1-vs-2 distinction is atomic: there is no window where a site outage can masquerade as a device failure, and no
        cross-item or cross-host polling race. If the console entry is missing from the payload entirely, offline
        deliberately resolves to 1 (fail open) rather than silently suppressing offline detection for the site.'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var hostId = '{$HOSTID}';
          var id = '{$DEVICEID}';
          var devStatus = null;
          var consoleOffline = false;
          for (var i = 0; i < d.data.length; i++) {
              if (d.data[i].hostId !== hostId) continue;
              var devs = d.data[i].devices || [];
              for (var j = 0; j < devs.length; j++) {
                  if (devs[j].id === id) devStatus = devs[j].status || 'unknown';
                  if (devs[j].isConsole && /offline/.test(String(devs[j].status))) consoleOffline = true;
              }
          }
          if (devStatus === null || !/offline/.test(devStatus)) return 0;
          return consoleOffline ? 2 : 1;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.api.device.raw
      valuemap:
        name: Device offline state
      tags:
      - tag: component
        value: device
      triggers:
      - uuid: f7c0cd7ab5e1468a82727ab23d407f9c
        expression: last(/Ubiquiti UniFi Device/unifi.api.device.offlineState)=1
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: last(/Ubiquiti UniFi Device/unifi.api.device.offlineState)=0
        name: '{HOST.NAME} is offline'
        priority: HIGH
        description: This UniFi device has gone offline while its console was still cloud-connected - a genuine
          single-device failure, not a site-wide outage. Check physical power, PoE on the uplink switch port, and any
          upstream switch. If this is an AP, check nearby clients for connectivity loss. Fires on the first offline
          sample (~1 minute), because the site-outage distinction is made atomically inside the Offline State item
          rather than by waiting for confirmation. While the whole site is dark (state 2) no new problem is raised, and
          an already-open problem is held open rather than flap-closed; a device that stays offline after the site comes
          back alerts within a poll cycle.
    - uuid: f7b52deef83d41168b5d0b1a21ffbe2d
      name: Console Status
      type: DEPENDENT
      key: unifi.api.device.consoleStatus
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      description: Cloud-reported status of this device's own console, extracted from the same /v1/devices payload as
        the device Status item (the console lists itself with isConsole=true). Collected for visibility - when the
        console reads offline, the cloud cannot see the site at all and every per-device status is meaningless. The
        actual offline alerting decision is made atomically inside the Offline State item, not by comparing this item
        against Status in a trigger. Reads 'unknown' if no console entry is present in the payload.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var hostId = '{$HOSTID}';
          for (var i = 0; i < d.data.length; i++) {
              if (d.data[i].hostId !== hostId) continue;
              var devs = d.data[i].devices || [];
              for (var j = 0; j < devs.length; j++) {
                  if (devs[j].isConsole) return devs[j].status || 'unknown';
              }
          }
          return 'unknown';
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.api.device.raw
      tags:
      - tag: component
        value: device
    - uuid: c1b1a32e7be247d689ac64750071cd79
      name: Firmware Status
      type: DEPENDENT
      key: unifi.api.device.firmwareStatus
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var id = '{$DEVICEID}';
          var hostId = '{$HOSTID}';
          for (var i = 0; i < d.data.length; i++) {
              if (d.data[i].hostId !== hostId) continue;
              var devs = d.data[i].devices || [];
              for (var j = 0; j < devs.length; j++) {
                  if (devs[j].id === id) return devs[j].firmwareStatus || 'unknown';
              }
          }
          return 'unknown';
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: unifi.api.device.raw
      tags:
      - tag: component
        value: device
      triggers:
      - uuid: d25a351ab10944f9af7d9179e9261487
        expression: find(/Ubiquiti UniFi Device/unifi.api.device.firmwareStatus,#1,"regexp","^upToDate$")<>1 and 
          find(/Ubiquiti UniFi Device/unifi.api.device.firmwareStatus,#1,"regexp","offline")<>1 and find(/Ubiquiti UniFi
          Device/unifi.api.device.firmwareStatus,#1,"regexp","unknown")<>1
        name: 'Firmware update available for {HOST.NAME}: {ITEM.LASTVALUE}'
        priority: INFO
        description: This device has a firmware update available or is in an unexpected firmware state. Schedule an 
          update via the UniFi dashboard during a maintenance window.
    - uuid: 65054c4effea4e02b50414f3404bfc13
      name: Firmware Update Version
      type: DEPENDENT
      key: unifi.api.device.updateAvailable
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var id = '{$DEVICEID}';
          var hostId = '{$HOSTID}';
          for (var i = 0; i < d.data.length; i++) {
              if (d.data[i].hostId !== hostId) continue;
              var devs = d.data[i].devices || [];
              for (var j = 0; j < devs.length; j++) {
